name: Upload URL → Google Drive (ZIP, auth‑aware)

# אפשרות להריץ ידנית עם שלושה inputs
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ (אם זה GitHub private, הוא ייטען עם PAT)"
        required: true
        default: "https://github.com/poseny/url-to-drive/raw/main/README.md"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – ייקח משם הקובץ ב‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (zip, curl, jq כבר במערכת)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  כתיבת קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  חישוב שמות – zip_name (ב‑Drive) + internal_name (ב‑ZIP)
      # --------------------------------------------------------------
      - name: Determine names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          # 3.1 – שם הקובץ מה‑URL (לדוגמה README.md)
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # 3.2 – שם בסיס ל‑ZIP
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"
          fi

          zip_name="${base_name}.zip"
          internal_name="$decoded_name"

          echo "📦 ZIP name on Drive      = $zip_name"
          echo "📁 Internal name in ZIP   = $internal_name"

          remote_path="gdrive:${{ github.event.inputs.folder }}/${zip_name}"
          echo "zip_name=$zip_name"        >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path"  >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  מחיקת קובץ קיים באותו שם (אם קיים)
      # --------------------------------------------------------------
      - name: Delete previous ZIP (if any)
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No old file to delete"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה → zip → upload
      # --------------------------------------------------------------
      - name: Download → zip (preserve internal name) → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.names.outputs.internal_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
          # PAT – נשמר כ-secret ולא נחשף בלוגים
          GH_TOKEN: ${{ secrets.AGITHUB_PAT }}
        run: |
          set -e
          set -o pipefail

          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"

          # -------------------------------------------------
          # האם ה‑URL שייך ל‑github.com ?
          # אם כן – נשתמש ב‑curl עם Authorization header.
          # אחרת – נשתמש ב‑wget רגיל (אין צורך ב‑token).
          # -------------------------------------------------
          if [[ "$FILE_URL" == https://github.com/* || "$FILE_URL" == https://raw.githubusercontent.com/* ]]; then
            # ---------- GitHub‑specific download ----------
            # 1️⃣ אם ה‑URL הוא כבר raw‑github (raw.githubusercontent.com) – אין צורך לשנות אותו,
            #    רק מוסיפים את ה‑header כדי לקבל גישה לקבצים פרטיים.
            # 2️⃣ במקרים של https://github.com/<owner>/<repo>/blob/...   – יש לנתב ל‑raw.
            #    נבצע המרה פשוטה:
            RAW_URL="${FILE_URL}"
            if [[ "$RAW_URL" == *"/blob/"* ]]; then
              RAW_URL=$(echo "$RAW_URL" | sed -e 's#github.com#raw.githubusercontent.com#' -e 's#/blob/##')
            fi

            echo "🔗 Using raw URL for GitHub: $RAW_URL"

            # ---- הורדה עם token ----
            curl -L -s -H "Authorization: token $GH_TOKEN" \
                 -H "Accept: application/vnd.github.raw" \
                 "$RAW_URL" \
              | zip -q - -:"$INTERNAL_NAME" - \
              | rclone rcat "$DEST_PATH" --progress

          else
            # ---------- כל אתר אחר ----------
            wget -q -O - "$FILE_URL" \
              | zip -q - -:"$INTERNAL_NAME" - \
              | rclone rcat "$DEST_PATH" --progress
          fi
