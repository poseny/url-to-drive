name: Upload URL → Google Drive (ZIP, עם אימות)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ (אפשר גם קישורים פרטיים)"
        required: true
        default: "https://example.com/protected/file.mp4"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – נלקח מה‑URL)"
        required: false
        default: ""
      auth_method:
        description: "שיטת אימות – none | token | basic | session"
        required: true
        default: "none"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 0️⃣  הגדרת סודות (הסוד של GitHub PAT הוא AGITHUB_PAT)
      # --------------------------------------------------------------
      #   • RCLONE_GDRIVE_TOKEN – טוקן של Google Drive (כפי שהיה קודם)
      #   • AGITHUB_PAT         – Personal Access Token של GitHub
      #   • AUTH_USER, AUTH_PASS – למצב Basic Auth (אם תצטרך)
      #   • LOGIN_URL, USERNAME, PASSWORD, LOGIN_FORM_FIELDS – למצב Session
      # --------------------------------------------------------------

      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (zip, curl כבר במערכת)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  כתיבת קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  חישוב שמות הקבצים (ZIP name + internal name)
      # --------------------------------------------------------------
      - name: Determine names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"
          fi
          zip_name="${base_name}.zip"
          internal_name="$decoded_name"
          remote_path="gdrive:${{ github.event.inputs.folder }}/$zip_name"
          echo "zip_name=$zip_name"          >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path"    >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  (אופציונלי) מחיקת קובץ קיים ב‑Drive
      # --------------------------------------------------------------
      - name: Delete previous ZIP (if any)
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous ZIP found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  בניית פרמטרי curl לפי שיטת האימות
      # --------------------------------------------------------------
      - name: Prepare curl options for authentication
        id: curlopts
        env:
          AUTH_METHOD: ${{ github.event.inputs.auth_method }}
          # כאן משתמשים בסוד החדש שהגדרת – AGITHUB_PAT
          AGITHUB_PAT: ${{ secrets.AGITHUB_PAT }}
          AUTH_USER: ${{ secrets.AUTH_USER }}
          AUTH_PASS: ${{ secrets.AUTH_PASS }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LOGIN_FORM_FIELDS: ${{ secrets.LOGIN_FORM_FIELDS }}
        run: |
          set -e
          CURL_OPTS="-L -s"                 # -L follow redirects, -s silent

          if [[ "$AUTH_METHOD" == "token" ]]; then
            if [[ -z "$AGITHUB_PAT" ]]; then
              echo "❌ Secret AGITHUB_PAT is required for token auth"
              exit 1
            fi
            CURL_OPTS="$CURL_OPTS -H \"Authorization: token $AGITHUB_PAT\""

          elif [[ "$AUTH_METHOD" == "basic" ]]; then
            if [[ -z "$AUTH_USER" || -z "$AUTH_PASS" ]]; then
              echo "❌ AUTH_USER and AUTH_PASS secrets required for basic auth"
              exit 1
            fi
            CURL_OPTS="$CURL_OPTS -u \"$AUTH_USER:$AUTH_PASS\""

          elif [[ "$AUTH_METHOD" == "session" ]]; then
            if [[ -z "$LOGIN_URL" || -z "$USERNAME" || -z "$PASSWORD" ]]; then
              echo "❌ LOGIN_URL, USERNAME and PASSWORD secrets required for session auth"
              exit 1
            fi
            COOKIE_JAR=$(mktemp)
            # בנייה של POST data – אם יש JSON של שדות, משתמשים בו
            if [[ -n "$LOGIN_FORM_FIELDS" ]]; then
              POST_DATA=$(echo "$LOGIN_FORM_FIELDS" | \
                jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|join("&")')
            else
              POST_DATA="login=$USERNAME&password=$PASSWORD"
            fi
            echo "🔐 Performing login POST to $LOGIN_URL"
            curl -s -c "$COOKIE_JAR" -d "$POST_DATA" "$LOGIN_URL" > /dev/null
            CURL_OPTS="$CURL_OPTS -b \"$COOKIE_JAR\""
          fi

          echo "curl_opts=$CURL_OPTS" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 6️⃣  הורדה → zip → העלאה (ה‑curl משתמש באופציות שהוכנו)
      # --------------------------------------------------------------
      - name: Download → zip → upload (with auth)
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.names.outputs.internal_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
          CURL_OPTS: ${{ steps.curlopts.outputs.curl_opts }}
        run: |
          set -e
          set -o pipefail

          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"
          echo "Curl options   = $CURL_OPTS"

          # השתמש ב‑eval כדי שה‑options שנבנו יתקבלו כ‑פרמטרים נפרדים ל‑curl
          eval "curl $CURL_OPTS \"$FILE_URL\" \
            | zip -q - -:\"$INTERNAL_NAME\" - \
            | rclone rcat \"$DEST_PATH\" --progress"
