      # --------------------------------------------------------------
      # 5️⃣  Extract links with Playwright (עם גלילה אינסופית)
      # --------------------------------------------------------------
      - name: Extract links with Playwright
        id: extract
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          set -euo pipefail               # חוסך בעיות של משתנים ריקים
          cd "$TMPDIR"

          # ---------- 5.1. התקנת Node, npm, playwright ----------
          echo "🔧 Installing Node.js, npm and Playwright …"
          sudo apt-get update -qq
          sudo apt-get install -y nodejs npm  # Node 20 כבר במקומת‑הפצה
          npm install -g playwright           # מתקין החבילה גלובלית
          # מתקין את הדפדפן Chromium (ה‑headless) – רק פעם אחת במכונה
          playwright install chromium

          # ---------- 5.2. כתיבת סקריפט Node ----------
          cat > scrape.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          //--- קבלת כתובת ה‑URL מה‑env ---------------------------------
          const url = process.env.FILE_URL;
          if (!url) {
            console.error('❌ FILE_URL environment variable is missing');
            process.exit(1);
          }

          //--- רשימת סיומות מדיה שאנחנו מקבלים -------------------------
          const mediaExt = [
            'webm','mp4','mkv','mov','avi','flv','wmv',
            'jpg','jpeg','png','gif','svg','bmp','tif','tiff',
            'pdf','mp3','ogg','wav','flac','aac'
          ];
          const mediaPattern = new RegExp(`https?://[^"\\s]+\\.(${mediaExt.join('|')})([?&#].*)?$`, 'i');

          //--- פונקציית עזר להסרת query‑string / hash --------------------
          const cleanUrl = (u) => u.split(/[?&#]/)[0];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            const found = new Set();

            //--- נעקוב אחרי כל תגובת רשת (response) -----------------------
            page.on('response', async (resp) => {
              const u = resp.url();
              if (mediaPattern.test(u)) {
                found.add(cleanUrl(u));
              }
            });

            console.log(`🌐 Opening ${url}`);
            await page.goto(url, { waitUntil: 'networkidle' });

            //--- גלילה אינסופית – עד שלא גדל יותר ה‑scrollHeight -------
            let previousHeight = 0;
            while (true) {
              const newHeight = await page.evaluate(() => document.body.scrollHeight);
              if (newHeight === previousHeight) break;   // אין עוד תוכן
              previousHeight = newHeight;
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(1500);           // זמן לטעינה של ה‑lazy‑load
            }

            //--- קישורים שייתכן ונמצאים רק ב‑DOM (ולא ברשת) ----------
            const domLinks = await page.$$eval('a[href]', els => els.map(e => e.href));
            domLinks.forEach(l => {
              if (mediaPattern.test(l)) found.add(cleanUrl(l));
            });

            await browser.close();

            const sorted = Array.from(found).sort();
            const outPath = path.resolve('links.txt');
            if (sorted.length === 0) {
              console.warn('⚠️ No media links were detected – writing placeholder file');
              fs.writeFileSync(outPath, 'No direct media links found on this page.\n');
            } else {
              fs.writeFileSync(outPath, sorted.join('\n') + '\n');
            }
            console.log(`✅ Extracted ${sorted.length} unique media link(s) → ${outPath}`);
          })().catch(err => {
            console.error('🚨 Unexpected error:', err);
            process.exit(1);
          });
          EOF

          # ---------- 5.3. הרצת הסקריפט ----------
          echo "🚀 Running Playwright scraper …"
          node scrape.js

          # ---------- 5.4. חשיפת הקובץ לשאר ה‑steps ----------
          LINKS_FILE="$(pwd)/links.txt"
          echo "links_path=$LINKS_FILE" >> $GITHUB_OUTPUT
          echo "📄 First 10 lines of links.txt:"
          head -n 10 "$LINKS_FILE" || true
