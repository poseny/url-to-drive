name: Upload ulr → Google Drive (scroll clean links, no zip)

# הרצה ידנית מה־UI של GitHub
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של קובץ מדיה או של דף HTML"
        required: true
        default: "https://commons.wikimedia.org/wiki/File:Bilby_Looking_for_food_at_night.webm"

      folder:
        description: "תיקיית יעד ב־Drive, ללא שם קובץ"
        required: true
        default: "MyUploads"

      filename:
        description: "שם קובץ לבסיס, בלי סיומת. אם ריק – ייקח מה־URL/כותרת הדף"
        required: false
        default: ""

      scroll_passes:
        description: "כמה פעמים לגלול למטה בדף"
        required: false
        default: "20"

      scroll_wait_ms:
        description: "זמן המתנה אחרי כל גלילה, באלפיות שנייה"
        required: false
        default: "1500"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # --------------------------------------------------------------
      # 0️⃣ Checkout – רק כדי שה־UI של GitHub יראה את ה־workflow
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # --------------------------------------------------------------
      # 1️⃣ Node.js + rclone + Playwright
      # --------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install rclone + Playwright
        run: |
          curl -s https://rclone.org/install.sh | sudo bash

          sudo apt-get update -qq
          sudo apt-get install -y lynx

          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # --------------------------------------------------------------
      # 2️⃣ Write rclone config
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣ Resolve content-type ובחירת שם בסיס
      # --------------------------------------------------------------
      - name: Resolve content-type & base name
        id: resolve
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          CONTENT_TYPE=$(curl -sI -L "$FILE_URL" \
                          | awk -F': ' 'tolower($1)=="content-type" {v=$2} END{print v}' \
                          | tail -n 1 \
                          | sed 's/[[:space:]]*$//')

          echo "🕵️ Content-Type = $CONTENT_TYPE"

          if [[ -n "$USER_NAME" ]]; then
            BASE_NAME=$(python3 - "$USER_NAME" <<'PY'
          import sys, re
          s = sys.argv[1].strip()
          s = re.sub(r'[\\/:*?"<>|]+', '_', s)
          s = re.sub(r'\s+', ' ', s)
          print((s[:120] or "page").strip())
          PY
          )
          else
            if [[ "$CONTENT_TYPE" == text/html* ]]; then
              PAGE_TITLE=$(curl -sL "$FILE_URL" | lynx -dump -force_html -nolist -stdin | head -n 1)

              BASE_NAME=$(python3 - "$PAGE_TITLE" <<'PY'
          import sys, re
          s = sys.argv[1].strip()
          s = re.sub(r'[\\/:*?"<>|]+', '_', s)
          s = re.sub(r'\s+', ' ', s)
          print((s[:120] or "page").strip())
          PY
          )
            else
              raw_name=$(basename "$FILE_URL")
              raw_name=${raw_name%%\?*}
              BASE_NAME="${raw_name%.*}"
            fi
          fi

          echo "🔤 Base name = $BASE_NAME"

          echo "base_name=$BASE_NAME" >> "$GITHUB_OUTPUT"
          echo "content_type=$CONTENT_TYPE" >> "$GITHUB_OUTPUT"
          echo "remote_base=gdrive:${{ github.event.inputs.folder }}/$BASE_NAME" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------
      # 4️⃣ Create temporary working directory
      # --------------------------------------------------------------
      - name: Create temporary directory
        id: tmpdir
        run: |
          TMPDIR=$(mktemp -d)
          echo "tmpdir=$TMPDIR" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------
      # 5️⃣ Download / scroll / extract clean links / upload
      # --------------------------------------------------------------
      - name: Download / scroll / extract clean links / upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          CONTENT_TYPE: ${{ steps.resolve.outputs.content_type }}
          BASE_NAME: ${{ steps.resolve.outputs.base_name }}
          REMOTE_BASE: ${{ steps.resolve.outputs.remote_base }}
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}

          SCROLL_PASSES: ${{ github.event.inputs.scroll_passes }}
          SCROLL_WAIT_MS: ${{ github.event.inputs.scroll_wait_ms }}

        run: |
          set -e
          set -o pipefail
          cd "$TMPDIR"

          # ------------------- קובץ מדיה ---------------------------
          if [[ "$CONTENT_TYPE" != text/html* ]]; then
            echo "📥 Downloading media file → $BASE_NAME"

            curl -L -f -sS -o "$BASE_NAME" "$FILE_URL"

            echo "🚀 Uploading media file directly to Drive"
            rclone copy "$BASE_NAME" "$REMOTE_BASE" --progress

          # ------------------- דף HTML ----------------------------
          else
            cat > extract_links.js <<'NODE'
            const { chromium } = require('playwright');
            const fs = require('fs');

            const fileUrl = process.env.FILE_URL;
            const passes = Math.max(1, Number(process.env.SCROLL_PASSES || '20'));
            const waitMs = Math.max(250, Number(process.env.SCROLL_WAIT_MS || '1500'));

            const mediaExt = /\.(webm|mp4|mkv|mov|avi|flv|wmv|jpg|jpeg|png|gif|svg|bmp|tif|tiff|pdf|mp3|ogg|wav|flac|aac)(?:[?#].*)?$/i;

            const directLinks = new Set();

            function cleanUrl(raw) {
              if (!raw || typeof raw !== 'string') return null;

              let u = raw.trim();
              if (!u) return null;

              u = u.replace(/^["']|["']$/g, '');
              u = u.replace(/&amp;/g, '&');
              u = u.replace(/[)}\].,;]+$/, '');

              if (u.startsWith('//')) u = 'https:' + u;
              if (u.startsWith('/')) u = 'https://commons.wikimedia.org' + u;

              try {
                const parsed = new URL(u);

                if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                  return null;
                }

                parsed.hash = '';
                return parsed.toString();
              } catch {
                return null;
              }
            }

            function isCommonsFilePage(parsed) {
              return /(^|\.)commons\.wikimedia\.org$/i.test(parsed.hostname) &&
                     /^\/wiki\/File:/i.test(parsed.pathname);
            }

            function addDirect(raw) {
              const parts = String(raw).split(',');

              for (const part of parts) {
                const token = part.trim().split(/\s+/)[0];
                const u = cleanUrl(token);

                if (!u) continue;

                let p;
                try {
                  p = new URL(u);
                } catch {
                  continue;
                }

                // דפי קובץ הם HTML, לא קישור ישיר לקובץ
                if (isCommonsFilePage(p)) continue;

                if (mediaExt.test(u)) {
                  directLinks.add(u);
                }
              }
            }

            function addFilePage(raw) {
              const u = cleanUrl(raw);
              if (!u) return;

              let p;
              try {
                p = new URL(u);
              } catch {
                return;
              }

              if (!/(^|\.)commons\.wikimedia\.org$/i.test(p.hostname)) return;
              if (!/^\/wiki\/File:/i.test(p.pathname)) return;

              let title;
              try {
                title = decodeURIComponent(p.pathname.replace(/^\/wiki\/File:/i, ''));
              } catch {
                title = p.pathname.replace(/^\/wiki\/File:/i, '');
              }

              if (!/\.(webm|mp4|mkv|mov|avi|flv|wmv|jpg|jpeg|png|gif|svg|bmp|tif|tiff|pdf|mp3|ogg|wav|flac|aac)(?:[?#].*)?$/i.test(title)) {
                return;
              }

              const safe = encodeURIComponent(title).replace(/%20/g, '_');

              // קישור הורדה ישיר ב־Commons. הוא מפנה לקובץ המקורי.
              directLinks.add(`https://commons.wikimedia.org/wiki/Special:Redirect/file/${safe}`);
            }

            function extractText(text) {
              if (!text || typeof text !== 'string') return;

              // קישורי מדיה ישירים
              for (const m of text.matchAll(/https?:\/\/[^\s"'<>\\]+/gi)) {
                addDirect(m[0]);
              }

              // דפי קובץ מ־Commons
              for (const m of text.matchAll(/https?:\/\/commons\.wikimedia\.org\/wiki\/File:[^\s"'<>\\]+/gi)) {
                addFilePage(m[0]);
              }

              // דפי קובץ יחסיים
              for (const m of text.matchAll(/\/wiki\/File:[^\s"'<>\\]+/gi)) {
                addFilePage(m[0]);
              }
            }

            async function collectFromPage(page) {
              const values = await page.evaluate(() => {
                const attrs = [
                  'href',
                  'src',
                  'data-src',
                  'data-url',
                  'data-file-url',
                  'data-original',
                  'data-original-url',
                  'data-media-url',
                  'data-href',
                  'data-file',
                  'data-thumb-url',
                  'srcset',
                  'data-srcset'
                ];

                const selectors = [
                  'a[href]',
                  'img',
                  'video',
                  'source',
                  'meta[property="og:image"]',
                  'meta[name="twitter:image"]',
                  '[src]',
                  '[data-src]',
                  '[data-url]',
                  '[data-file-url]',
                  '[data-original]',
                  '[data-original-url]',
                  '[data-media-url]',
                  '[data-href]',
                  '[data-file]',
                  '[data-thumb-url]'
                ].join(',');

                const out = [];

                document.querySelectorAll(selectors).forEach(el => {
                  for (const a of attrs) {
                    const v = el.getAttribute(a);
                    if (v) out.push(v);
                  }

                  const srcset = el.getAttribute('srcset');
                  if (srcset) out.push(srcset);

                  const dataSrcset = el.getAttribute('data-srcset');
                  if (dataSrcset) out.push(dataSrcset);
                });

                const bodyText = document.body
                  ? (document.body.innerText || document.body.textContent || '')
                  : '';

                if (bodyText) out.push(bodyText);

                document.querySelectorAll('script').forEach(script => {
                  const t = script.textContent || '';

                  if (
                    t.includes('commons.wikimedia.org') ||
                    /\/wiki\/File:|Special:Redirect\/file|\.webm|\.mp4|\.jpg|\.png|\.gif/i.test(t)
                  ) {
                    out.push(t);
                  }
                });

                return out;
              });

              for (const v of values) {
                extractText(v);
              }
            }

            async function clickLoadMore(page) {
              const selectors = [
                'button:has-text("Load more")',
                'button:has-text("טען עוד")',
                'button:has-text("טוען עוד")',
                'button:has-text("עוד תוצאות")',
                'a:has-text("Load more")',
                'a:has-text("טען עוד")',
                'a:has-text("טוען עוד")',
                'a:has-text("עוד תוצאות")',
                '[class*="load-more"]',
                '[class*="LoadMore"]'
              ];

              for (const selector of selectors) {
                const loc = page.locator(selector).first();

                if (await loc.isVisible({ timeout: 1000 }).catch(() => false)) {
                  await loc.click({ timeout: 5000 }).catch(() => {});
                  await page.waitForTimeout(800);
                }
              }
            }

            (async () => {
              if (!fileUrl) {
                throw new Error('FILE_URL is empty');
              }

              const browser = await chromium.launch({
                headless: true,
                args: ['--no-sandbox', '--disable-setuid-sandbox']
              });

              const page = await browser.newPage({
                viewport: { width: 1440, height: 1200 },
                userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36'
              });

              page.setDefaultTimeout(60000);

              console.log(`Opening: ${fileUrl}`);

              await page.goto(fileUrl, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });

              await page.waitForTimeout(3000);

              await page.waitForSelector(
                'a[href*="/wiki/File:"], a[href*="Special:Redirect/file"]',
                { timeout: 60000 }
              ).catch(() => {
                console.log('No file links found yet; continuing anyway.');
              });

              await collectFromPage(page);

              for (let i = 0; i < passes; i++) {
                await page.evaluate((step) => {
                  const h = window.innerHeight || 900;
                  const scrollStep = Math.max(700, Math.floor(h * 0.85));

                  window.scrollBy(0, scrollStep);

                  if (window.scrollY >= document.documentElement.scrollHeight - h - 10) {
                    window.scrollTo(0, 0);
                    window.scrollBy(0, scrollStep * (step + 1));
                  }
                }, i);

                await page.waitForTimeout(waitMs);

                await clickLoadMore(page);

                await page.waitForTimeout(Math.min(1000, waitMs));

                await collectFromPage(page);

                console.log(`pass ${i + 1}/${passes}: direct links=${directLinks.size}`);
              }

              await page.evaluate(() => {
                window.scrollTo(0, document.documentElement.scrollHeight);
              });

              await page.waitForTimeout(2000);
              await collectFromPage(page);

              await browser.close();

              const lines = [...directLinks].sort();

              if (lines.length === 0) {
                fs.writeFileSync('links.txt', 'No clean direct media links were found on the page.\n');
              } else {
                fs.writeFileSync('links.txt', lines.join('\n') + '\n');
              }

              console.log(`Found ${lines.length} direct media links`);
            })().catch(err => {
              console.error(err);
              fs.writeFileSync('links.txt', `Error extracting links: ${err.message}\n`);
              process.exit(1);
            });
            NODE

            echo "🧭 Scrolling page and extracting links"
            node extract_links.js

            sort -u "links.txt" -o "links.txt"

            echo "🚀 Uploading the cleaned links file as ${BASE_NAME}.txt"
            rclone copy "links.txt" "${REMOTE_BASE}.txt" --progress
          fi

      # --------------------------------------------------------------
      # 6️⃣ Clean-up
      # --------------------------------------------------------------
      - name: Clean temporary files
        if: always()
        env:
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          rm -rf "$TMPDIR" || true
