name: Download YouTube → Google Drive (ZIP / TGZ – DEBUG)

# מאפשר הרצה ידנית – 4 קלטים: url, compress, folder, filename
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "קישור של סרטון YouTube (לדוגמה https://www.youtube.com/watch?v=ABC123)"
        required: true
        default: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      compress:
        description: "סוג דחיסה – none | zip | tgz"
        required: true
        default: "zip"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ). לדוגמה: MyYouTube"
        required: true
        default: "MyYouTube"
      filename:
        description: "שם קובץ (ללא סיומת) – אם ריק, ייקח את שם הסרטון מה‑YouTube"
        required: false
        default: ""

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 0️⃣  הפעלת דיבוג של GitHub Actions (צריך להגדיר secret)
      # --------------------------------------------------------------
      #   פתח Settings → Secrets → Actions → New repository secret
      #   שם: ACTIONS_STEP_DEBUG
      #   ערך: true
      #   (לא חובה – רק מוסיף לוגים של פעולות הפנימיות של GitHub)

      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone, yt‑dlp ו‑ffmpeg (חובה כדי ש‑yt‑dlp יוכל למזג וידאו+אודיו)
      # --------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e
          echo "🔧 Installing rclone …"
          curl https://rclone.org/install.sh | sudo bash

          echo "🔧 Installing yt-dlp …"
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          python3 -m pip install --quiet yt-dlp

          echo "🔧 Installing ffmpeg (needed for merging streams) …"
          sudo apt-get install -y -qq ffmpeg

          # zip ו‑tar כבר קיימים במערכת, אבל נוודא שה‑locale תומך בעברית/UTF‑8
          sudo locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

      # --------------------------------------------------------------
      # 2️⃣  כתיבת קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          set -e
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
