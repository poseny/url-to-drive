name: Upload URL → Google Drive (Zip via temporary file)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ/סרטון להורדה"
        required: true
        default: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – ייקח משם הקובץ ב‑URL/YouTube)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # ────────────────────────────────────────────────────────────────
      # 1️⃣  התקנת תלויות
      # ────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip zip ffmpeg
          
          # rclone
          curl https://rclone.org/install.sh | sudo bash
          
          # yt-dlp
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      # ────────────────────────────────────────────────────────────────
      # 2️⃣  קונפיג של rclone – עם בדיקת תקינות
      # ────────────────────────────────────────────────────────────────
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          
          # בדיקה שה-token לא ריק
          if [ -z "$RCLONE_GDRIVE_TOKEN" ]; then
            echo "❌ RCLONE_GDRIVE_TOKEN is empty!"
            exit 1
          fi
          
          echo "Token length: ${#RCLONE_GDRIVE_TOKEN}"
          echo "Token starts with: ${RCLONE_GDRIVE_TOKEN:0:20}..."
          
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = ${RCLONE_GDRIVE_TOKEN}
          EOF
          
          echo "✅ rclone config written"

      # ────────────────────────────────────────────────────────────────
      # 3️⃣  חשבון שמות
      # ────────────────────────────────────────────────────────────────
      - name: Determine file names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          if echo "$FILE_URL" | grep -iq "youtube.com\|youtu.be"; then
            base_name="${USER_NAME:-yt_video}"
          else
            raw_name=$(basename "$FILE_URL")
            raw_name=${raw_name%%\?*}
            decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
            base_name="${USER_NAME:-${decoded_name%.*}}"
          fi

          # ניקוי תווים בלתי חוקיים מהשם
          base_name=$(echo "$base_name" | sed 's/[\/\\:*?"<>|]/_/g')

          zip_name="${base_name}.zip"
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT

          remote_path="gdrive:${{ github.event.inputs.folder }}/$zip_name"
          echo "remote_path=$remote_path" >> $GITHUB_OUTPUT
          echo "📛 ZIP name: $zip_name"
          echo "📁 Remote path: $remote_path"

      # ────────────────────────────────────────────────────────────────
      # 4️⃣  בדיקת חיבור ל-Drive
      # ────────────────────────────────────────────────────────────────
      - name: Test rclone connection
        run: |
          echo "🔍 Testing rclone connection..."
          rclone lsd gdrive: || {
            echo "❌ Cannot connect to gdrive. Checking config..."
            cat ~/.config/rclone/rclone.conf
            exit 1
          }
          echo "✅ Connected to Google Drive"

      # ────────────────────────────────────────────────────────────────
      # 5️⃣  מחיקת קובץ קיים
      # ────────────────────────────────────────────────────────────────
      - name: Delete old ZIP if exists
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting previous $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous ZIP found"
          fi

      # ────────────────────────────────────────────────────────────────
      # 6️⃣  הורדה → ZIP → העלאה
      # ────────────────────────────────────────────────────────────────
      - name: Download → zip → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          set -e
          set -o pipefail

          TMP_DIR=$(mktemp -d)
          echo "📂 Working directory = $TMP_DIR"

          # ---------- 6.1 הורדה ----------
          if echo "$FILE_URL" | grep -iq "youtube.com\|youtu.be"; then
            echo "🎬 Detected YouTube URL – using yt-dlp"
            yt-dlp --no-playlist -f "bestvideo+bestaudio/best" \
              -o "${TMP_DIR}/downloaded_media.%(ext)s" \
              --merge-output-format mkv \
              "$FILE_URL" 2>&1 || {
                echo "⚠️ yt-dlp failed, trying audio only..."
                yt-dlp --no-playlist -f "bestaudio/best" \
                  -o "${TMP_DIR}/downloaded_media.%(ext)s" \
                  "$FILE_URL"
              }
            
            DOWNLOADED_FILE=$(find "$TMP_DIR" -type f | head -n1)
          else
            echo "⬇️ Direct URL – using curl"
            DOWNLOADED_FILE="${TMP_DIR}/downloaded_file"
            curl -L --max-time 600 -s -o "$DOWNLOADED_FILE" "$FILE_URL" || {
              echo "❌ curl failed with code $?"
              exit 1
            }
          fi

          if [[ ! -s "$DOWNLOADED_FILE" ]]; then
            echo "❌ Download failed or file is empty"
            ls -la "$TMP_DIR"
            exit 1
          fi
          
          echo "✅ Downloaded → $DOWNLOADED_FILE"
          echo "   Size: $(du -h "$DOWNLOADED_FILE" | cut -f1)"

          # ---------- 6.2 יצירת ZIP ----------
          ZIP_PATH="${TMP_DIR}/${ZIP_NAME}"
          ORIGINAL_NAME="$(basename "$DOWNLOADED_FILE")"
          cp "$DOWNLOADED_FILE" "${TMP_DIR}/${ORIGINAL_NAME}"
          
          (cd "$TMP_DIR" && zip -j -q "$ZIP_PATH" "$ORIGINAL_NAME")
          
          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "❌ Zip creation failed"
            exit 1
          fi
          echo "🗜️ Created ZIP → $ZIP_PATH (size=$(du -h "$ZIP_PATH" | cut -f1))"

          # ---------- 6.3 העלאה ל-Drive ----------
          echo "🚀 Uploading ZIP to Drive: $DEST_PATH"
          rclone copy "$ZIP_PATH" "$DEST_PATH" --progress --drive-chunk-size 64M
          
          # וידוא העלאה
          if rclone lsf "$DEST_PATH" > /dev/null 2>&1; then
            echo "✅ Successfully uploaded to Google Drive!"
          else
            echo "❌ Upload verification failed"
            exit 1
          fi

          rm -rf "$TMP_DIR"
