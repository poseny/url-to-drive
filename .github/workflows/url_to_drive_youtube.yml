name: YouTube → Google Drive (download → zip/tgz → upload)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "קישור של סרטון YouTube"
        required: true
        default: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      compress:
        description: "סוג דחיסה – none | zip | tgz"
        required: true
        default: "zip"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ). לדוגמה: MyYouTube"
        required: true
        default: "MyYouTube"
      filename:
        description: "שם קובץ (ללא סיומת). אם ריק – ייקח את שם הסרטון מה‑YouTube"
        required: false
        default: ""

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 0️⃣  Debug – optional (set secret ACTIONS_STEP_DEBUG=true)
      # --------------------------------------------------------------

      # --------------------------------------------------------------
      # 1️⃣  Install rclone, yt‑dlp וב‑ffmpeg (חובה למיזוג video+audio)
      # --------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e
          echo "🔧 Installing rclone …"
          curl https://rclone.org/install.sh | sudo bash

          echo "🔧 Installing yt‑dlp …"
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          python3 -m pip install --quiet yt-dlp

          echo "🔧 Installing ffmpeg …"
          sudo apt-get install -y -qq ffmpeg

          # ו‑locale שמקודד כ‑UTF‑8 (מתאים לשמות עבריים)
          sudo locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

      # --------------------------------------------------------------
      # 2️⃣  כתיבת קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          set -e
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  קביעת שמות קבצים – שם קובץ המקור, שם קובץ ארכיון, שם קובץ ב‑Drive
      # --------------------------------------------------------------
      - name: Determine filenames
        id: name_builder
        env:
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
          USER_NAME: ${{ github.event.inputs.filename }}
          COMPRESS: ${{ github.event.inputs.compress }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e -x   # מדפיס כל פקודה לפני הריצה (דיבוג)

          # ---- שם הקובץ שמחזיר YouTube (כולל סיומת) ----
          raw_name=$(yt-dlp --get-filename -o "%(title)s.%(ext)s" "$YOUTUBE_URL")
          echo "🔤 Raw name from YouTube = $raw_name"

          # ---- שם הקובץ במערכת הקבצים (כולל סיומת) ----
          if [[ -n "$USER_NAME" ]]; then
            # משתמש סיפק שם ידני – משמרים את הסיומת המקורית של הקובץ
            base_name="$USER_NAME"
            original_ext="${raw_name##*.}"
            local_file="${base_name}.${original_ext}"
          else
            base_name="${raw_name%.*}"      # שם ללא סיומת
            local_file="$raw_name"          # כולל הסיומת המקורית
          fi

          # ---- שם קובץ ארכיון (zip/tgz) – אם אין דחיסה נשאר שם הקובץ המקורי ----
          case "$COMPRESS" in
            none) archive_name="$local_file" ;;
            zip)  archive_name="${base_name}.zip" ;;
            tgz)  archive_name="${base_name}.tgz" ;;
            *)    echo "❌ Unknown compress option: $COMPRESS" && exit 1 ;;
          esac

          echo "📦 Archive name (will be uploaded) = $archive_name"
          echo "📁 Local video file name           = $local_file"

          # נתיב קבוע בתיקיית /tmp (ה‑runner מנקה אחרי הריצה)
          VIDEO_PATH="/tmp/$local_file"
          ARCHIVE_PATH="/tmp/$archive_name"

          echo "video_path=$VIDEO_PATH"   >> $GITHUB_OUTPUT
          echo "archive_path=$ARCHIVE_PATH" >> $GITHUB_OUTPUT
          echo "archive_name=$archive_name" >> $GITHUB_OUTPUT
          echo "remote_folder=gdrive:${FOLDER}" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  (אופציונלי) מחיקת קובץ קיים באותו שם בתיקיית Drive
      # --------------------------------------------------------------
      - name: Delete previous file (if any)
        env:
          REMOTE_FOLDER: ${{ steps.name_builder.outputs.remote_folder }}
          ARCHIVE_NAME: ${{ steps.name_builder.outputs.archive_name }}
        run: |
          set -e
          if rclone lsf "${REMOTE_FOLDER}/${ARCHIVE_NAME}" > /dev/null 2>&1; then
            echo "🗑️ Deleting old ${REMOTE_FOLDER}/${ARCHIVE_NAME}"
            rclone delete "${REMOTE_FOLDER}/${ARCHIVE_NAME}"
          else
            echo "✅ No previous file found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדת הסרטון ל‑קובץ מקומי
      # --------------------------------------------------------------
      - name: Download video to temporary file
        id: download
        env:
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
          VIDEO_PATH: ${{ steps.name_builder.outputs.video_path }}
        run: |
          set -e -x
          # -f best – משיג את ה‑best format (audio+video במקביל)
          yt-dlp -f best -o "$VIDEO_PATH" "$YOUTUBE_URL"
          echo "✅ Download finished → $VIDEO_PATH"
          ls -lh "$VIDEO_PATH"

      # --------------------------------------------------------------
      # 6️⃣  יצירת ארכיון (ZIP / TGZ) או שמירה ישירה אם compress=none
      # --------------------------------------------------------------
      - name: Create archive (or keep raw video)
        id: archive
        env:
          COMPRESS: ${{ github.event.inputs.compress }}
          VIDEO_PATH: ${{ steps.name_builder.outputs.video_path }}
          ARCHIVE_PATH: ${{ steps.name_builder.outputs.archive_path }}
        run: |
          set -e -x
          if [[ "$COMPRESS" == "none" ]]; then
            # אין ארכיון – פשוט מחזירים את קובץ ה‑video כמקור
            echo "archive_file=$VIDEO_PATH" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$COMPRESS" == "zip" ]]; then
            # zip יוצר קובץ zip בשם $ARCHIVE_PATH, ושומר בתוכו את קובץ ה‑video בשם המקורי שלו
            zip -j -q "$ARCHIVE_PATH" "$VIDEO_PATH"
            echo "archive_file=$ARCHIVE_PATH" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$COMPRESS" == "tgz" ]]; then
            # tar –‑czf יוצר tgz, שומר על שם הקובץ המקורי בתוך ה‑archive
            tar -czf "$ARCHIVE_PATH" -C "$(dirname "$VIDEO_PATH")" "$(basename "$VIDEO_PATH")"
            echo "archive_file=$ARCHIVE_PATH" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "❌ Should never reach here"
          exit 1

      # --------------------------------------------------------------
      # 7️⃣  העלאת הקובץ (archive או video) ל‑Google Drive
      # --------------------------------------------------------------
      - name: Upload to Drive
        env:
          REMOTE_FOLDER: ${{ steps.name_builder.outputs.remote_folder }}
          ARCHIVE_FILE: ${{ steps.archive.outputs.archive_file }}
        run: |
          set -e -x
          echo "📤 Uploading $ARCHIVE_FILE → $REMOTE_FOLDER"
          # rclone copy משמר את שם הקובץ (basename של $ARCHIVE_FILE) בתיקייה המרוחקת
          rclone copy "$ARCHIVE_FILE" "$REMOTE_FOLDER" --progress

      # --------------------------------------------------------------
      # 8️⃣  בדיקה – מציג את הקבצים שבתיקיית Drive אחרי ההעלאה
      # --------------------------------------------------------------
      - name: List files in Drive folder (debug)
        env:
          REMOTE_FOLDER: ${{ steps.name_builder.outputs.remote_folder }}
        run: |
          set -e -x
          echo "📂 Files now present in $REMOTE_FOLDER :"
          rclone lsf "$REMOTE_FOLDER"

      # --------------------------------------------------------------
      # 9️⃣  ניקוי קבצים זמניים (רצוי כדי שלא למלא את ה‑/tmp של ה‑runner)
      # --------------------------------------------------------------
      - name: Clean up temporary files
        if: always()
        run: |
          set -e
          rm -rf /tmp/video_download*
          rm -rf /tmp/*.zip
          rm -rf /tmp/*.tgz
