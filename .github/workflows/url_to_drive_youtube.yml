name: Upload URL → Google Drive (Zip via temporary file)

# מאפשר הרצה ידנית
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ/סרטון להורדה"
        required: true
        default: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – ייקח משם הקובץ ב‑URL/YouTube)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # ────────────────────────────────────────────────────────────────
      # 1️⃣  התקנת rclone, yt-dlp, ffmpeg (הדרוש ל‑yt-dlp בכדי לשלב וידאו)
      # ────────────────────────────────────────────────────────────────
      - name: Install dependencies (rclone, yt-dlp, ffmpeg, zip)
        run: |
          # rclone – כפי שעשית קודם
          curl https://rclone.org/install.sh | sudo bash
          # yt-dlp – binary ישיר
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          # ffmpeg – דרוש להמרת אודיו/וידאו של yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # zip – כבר מותקן, רק למען שלמות
          sudo apt-get install -y zip

      # ────────────────────────────────────────────────────────────────
      # 2️⃣  קונפיג של rclone (remote בשם gdrive)
      # ────────────────────────────────────────────────────────────────
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # ────────────────────────────────────────────────────────────────
      # 3️⃣  חשבון שמות – zip_name (ב‑Drive) ו‑original_name (ב‑ZIP)
      # ────────────────────────────────────────────────────────────────
      - name: Determine file names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          # 3.1 – נזהה אם מדובר ב‑YouTube (או URL ישיר)
          if echo "$FILE_URL" | grep -iq "youtube.com\|youtu.be"; then
            # נשתמש בשם ברירת‑מחדל של yt-dlp (תחת הכותרת)
            base_name="${USER_NAME:-yt_video}"
          else
            raw_name=$(basename "$FILE_URL")
            raw_name=${raw_name%%\?*}
            decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
            base_name="${USER_NAME:-${decoded_name%.*}}"
          fi

          zip_name="${base_name}.zip"
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT

          # נתיב מרוחק ב‑Drive
          remote_path="gdrive:${{ github.event.inputs.folder }}/$zip_name"
          echo "remote_path=$remote_path" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────────────────────
      # 4️⃣  (אופציונלי) מחיקת קובץ קיים באותו שם על‑Drive
      # ────────────────────────────────────────────────────────────────
      - name: Delete old ZIP if it exists
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting previous $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous ZIP found"
          fi

      # ────────────────────────────────────────────────────────────────
      # 5️⃣  הורדת קובץ (YouTube או קובץ ישיר) → יצירת ZIP → העלאה ל‑Drive
      # ────────────────────────────────────────────────────────────────
      - name: Download → zip → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          set -e
          set -o pipefail

          TMP_DIR=$(mktemp -d)
          echo "📂 Working directory = $TMP_DIR"

          # ---------- 5.1 הורדה ----------
          if echo "$FILE_URL" | grep -iq "youtube.com\|youtu.be"; then
            echo "🎬 Detected YouTube URL – using yt-dlp"
            # -f bestvideo+bestaudio – מבקש את האיכות הטובה ביותר
            # -o משתנה שם קובץ: שם בסיס + המקור של הקובץ (כל מה שלא צריך)
            OUTPUT_PATH="${TMP_DIR}/downloaded_media.%(ext)s"
            yt-dlp -f "bestvideo+bestaudio/best" -o "$OUTPUT_PATH" "$FILE_URL"
            # מציאת שם הקובץ שה-yt-dlp יצר בפועל
            DOWNLOADED_FILE=$(ls "${TMP_DIR}" | head -n1)
            DOWNLOADED_FILE="${TMP_DIR}/${DOWNLOADED_FILE}"
          else
            echo "⬇️ Direct URL – using curl"
            DOWNLOADED_FILE="${TMP_DIR}/downloaded_file"
            curl -L -s -o "$DOWNLOADED_FILE" "$FILE_URL"
          fi

          # וידוא שהקובץ קיים ולא ריק
          if [[ ! -s "$DOWNLOADED_FILE" ]]; then
            echo "❌ Download failed or file is empty"
            ls -l "$TMP_DIR"
            exit 1
          fi
          echo "✅ Downloaded → $DOWNLOADED_FILE (size=$(stat -c%s "$DOWNLOADED_FILE") bytes)"

          # ---------- 5.2 יצירת ZIP ----------
          ZIP_PATH="${TMP_DIR}/${ZIP_NAME}"
          # נשתמש בשם הקובץ המקורי ב‑ZIP
          ORIGINAL_NAME="$(basename "$DOWNLOADED_FILE")"
          cp "$DOWNLOADED_FILE" "${TMP_DIR}/${ORIGINAL_NAME}"
          (cd "$TMP_DIR" && zip -j -q "$ZIP_PATH" "$ORIGINAL_NAME")
          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "❌ Zip creation failed"
            exit 1
          fi
          echo "🗜️ Created ZIP → $ZIP_PATH (size=$(stat -c%s "$ZIP_PATH") bytes)"

          # ---------- 5.3 העלאה ל‑Google Drive ----------
          echo "🚀 Uploading ZIP to Drive: $DEST_PATH"
          rclone copy "$ZIP_PATH" "$DEST_PATH" --progress

          # ניקוי – אופציונלי
          rm -rf "$TMP_DIR"
          echo "✅ Finished – ZIP uploaded successfully"
