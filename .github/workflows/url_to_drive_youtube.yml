name: Upload URL → Google Drive (Zip via temporary file)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ/סרטון להורדה"
        required: true
        default: "https://www.youtube.com/watch?v=I60j6jur_TY"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – ייקח משם הקובץ ב‑URL/YouTube)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # מוסיף זמן גיבוי למקרה של הורדה איטית
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת תלויות
      # --------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl zip ffmpeg python3 python3-pip
          
          # rclone
          curl -s https://rclone.org/install.sh | sudo bash
          
          # yt-dlp – דרך pip (יציב יותר מהורדת binary)
          pip3 install --upgrade yt-dlp
          
          # וידוא התקנה
          echo "=== yt-dlp version ==="
          yt-dlp --version
          echo "=== rclone version ==="
          rclone version

      # --------------------------------------------------------------
      # 2️⃣  קונפיג של rclone
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          
          # בדיקת חיבור
          echo "Testing rclone connection..."
          rclone lsd gdrive: || {
            echo "ERROR: Cannot connect to gdrive"
            exit 1
          }
          echo "✅ Connected to Google Drive"

      # --------------------------------------------------------------
      # 3️⃣  חישוב שמות
      # --------------------------------------------------------------
      - name: Determine file names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          if echo "$FILE_URL" | grep -iq "youtube.com\|youtu.be"; then
            # נשתמש בשם ברירת מחדל אם המשתמש לא נתן שם
            if [[ -n "$USER_NAME" ]]; then
              base_name="$USER_NAME"
            else
              base_name="yt_video"
            fi
          else
            raw_name=$(basename "$FILE_URL")
            raw_name=${raw_name%%\?*}
            decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
            base_name="${USER_NAME:-${decoded_name%.*}}"
          fi

          # ניקוי תווים בלתי חוקיים
          base_name=$(echo "$base_name" | sed 's/[\/\\:*?"<>|]/_/g')

          zip_name="${base_name}.zip"
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT
          echo "remote_path=gdrive:${{ github.event.inputs.folder }}/$zip_name" >> $GITHUB_OUTPUT
          echo "📛 ZIP name: $zip_name"

      # --------------------------------------------------------------
      # 4️⃣  מחיקת קובץ קיים
      # --------------------------------------------------------------
      - name: Delete old ZIP if exists
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting previous $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous ZIP found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה → ZIP → העלאה
      # --------------------------------------------------------------
      - name: Download → zip → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          set -e
          set -o pipefail

          TMP_DIR=$(mktemp -d)
          echo "📂 Working directory = $TMP_DIR"

          # ---------- 5.1 הורדה ----------
          if echo "$FILE_URL" | grep -iq "youtube.com\|youtu.be"; then
            echo "🎬 Detected YouTube URL – using yt-dlp"
            
            # נסיון ראשון: הורדת וידאו + אודיו
            yt-dlp \
              --no-playlist \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --merge-output-format mp4 \
              -o "${TMP_DIR}/%(title)s.%(ext)s" \
              --no-warnings \
              "$FILE_URL" 2>&1
            
            # מציאת הקובץ שהורד
            DOWNLOADED_FILE=$(find "$TMP_DIR" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" \) | head -n1)
            
            if [[ -z "$DOWNLOADED_FILE" ]]; then
              echo "⚠️ First attempt failed, trying audio only..."
              yt-dlp \
                --no-playlist \
                -f "bestaudio/best" \
                --extract-audio \
                --audio-format mp3 \
                -o "${TMP_DIR}/%(title)s.%(ext)s" \
                --no-warnings \
                "$FILE_URL" 2>&1
              DOWNLOADED_FILE=$(find "$TMP_DIR" -type f | head -n1)
            fi
          else
            echo "⬇️ Direct URL – using curl"
            DOWNLOADED_FILE="${TMP_DIR}/downloaded_file"
            curl -L --max-time 600 -s -o "$DOWNLOADED_FILE" "$FILE_URL"
          fi

          # בדיקה שהקובץ קיים
          if [[ -z "$DOWNLOADED_FILE" ]] || [[ ! -s "$DOWNLOADED_FILE" ]]; then
            echo "❌ Download failed or file is empty"
            ls -la "$TMP_DIR"
            exit 1
          fi
          
          echo "✅ Downloaded: $DOWNLOADED_FILE"
          echo "   Size: $(du -h "$DOWNLOADED_FILE" | cut -f1)"

          # ---------- 5.2 יצירת ZIP ----------
          ZIP_PATH="${TMP_DIR}/${ZIP_NAME}"
          ORIGINAL_NAME="$(basename "$DOWNLOADED_FILE")"
          
          cp "$DOWNLOADED_FILE" "${TMP_DIR}/${ORIGINAL_NAME}"
          (cd "$TMP_DIR" && zip -j -q "$ZIP_PATH" "$ORIGINAL_NAME")
          
          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "❌ Zip creation failed"
            exit 1
          fi
          echo "🗜️ Created ZIP: $ZIP_PATH (size=$(du -h "$ZIP_PATH" | cut -f1))"

          # ---------- 5.3 העלאה ל-Drive ----------
          echo "🚀 Uploading ZIP to Drive: $DEST_PATH"
          rclone copy "$ZIP_PATH" "$DEST_PATH" --progress
          
          # וידוא
          if rclone lsf "$DEST_PATH" > /dev/null 2>&1; then
            echo "✅ Successfully uploaded to Google Drive!"
          else
            echo "❌ Upload verification failed"
            exit 1
          fi

          rm -rf "$TMP_DIR"
