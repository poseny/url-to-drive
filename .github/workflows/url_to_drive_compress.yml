name: Upload URL → Google Drive (auto‑extension)

# מאפשר בחירה של URL, סוג דחיסה, ותיקיית יעד ב‑Drive
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL של הקובץ שיש להוריד"
        required: true
        default: "https://www.prog.co.il/attachments/%D7%A9%D7%97%D7%9E%D7%98-%D7%A2%D7%9D-%D7%97%D7%99%D7%93%D7%95%D7%AA-html.2266673/"
      compress:
        description: "סוג דחיסה – none | zip | tgz"
        required: true
        default: "none"
      folder:
        description: "תיקיית יעד ב‑Drive (בלי שם קובץ). לדוגמה: MyUploads"
        required: true
        default: "MyUploads"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣ התקנת rclone (zip כבר מותקן במערכת)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣ כתיבת קובץ קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣ בניית שם קובץ נכון ( עם סיומת ) לפני ההעלאה
      # --------------------------------------------------------------
      - name: Determine final file name
        id: name_builder
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          COMPRESS: ${{ github.event.inputs.compress }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ---- שלב 1 – קבלת שם קובץ גלוי מה‑URL --------------------
          # basename עובר על החלק אחרי ה‑last slash
          raw_name=$(basename "$FILE_URL")
          # אם יש ?query – מסירים
          raw_name=${raw_name%%\?*}
          # decode %XX (הפיכת קידוד %D7%AA וכו')
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🗂️ Raw name from URL = $raw_name"
          echo "🔤 Decoded name    = $decoded_name"

          # ---- שלב 2 – קביעת סיומת לפי compression ----------------
          case "$COMPRESS" in
            zip)  EXT=".zip"   ;;
            tgz)  EXT=".tgz"   ;;
            none) EXT=""       ;;
            *)    echo "❌ Unknown compress value: $COMPRESS" && exit 1 ;;
          esac

          # אם יש compression – נוריד את ההרחבה המקורית (אם יש) כדי
          # שלא ייווצרו שמות כמו "song.html.zip"
          if [[ -n "$EXT" ]]; then
            # strip existing extension (everything after last dot)
            base_without_ext="${decoded_name%.*}"
            final_name="${base_without_ext}${EXT}"
          else
            # ללא compression – משאירים את השם המקורי
            final_name="${decoded_name}"
          fi

          echo "📦 Final name that will be used in Drive = $final_name"

          # שמירת ערכים ל‑outputs כדי שנשתמש בהם בשלבים הבאים
          echo "final_name=$final_name" >> $GITHUB_OUTPUT
          echo "final_path=gdrive:${FOLDER}/${final_name}" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣ (אופציונלי) מחיקת קובץ קיים באותו שם לפני העלאה
      # --------------------------------------------------------------
      - name: Delete existing file in Drive (if any)
        env:
          REMOTE_PATH: ${{ steps.name_builder.outputs.final_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️  Deleting old file $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file found"
          fi

      # --------------------------------------------------------------
      # 5️⃣ הורדה → (דחיסה אם נדרש) → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Transfer (download → optional compress → upload)
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          COMPRESS: ${{ github.event.inputs.compress }}
          DEST_PATH: ${{ steps.name_builder.outputs.final_path }}
        run: |
          set -e

          echo "🔎 INPUTS"
          echo "URL      = $FILE_URL"
          echo "COMPRESS = $COMPRESS"
          echo "DEST     = $DEST_PATH"

          # ---------- אין דחיסה ----------
          if [[ "$COMPRESS" == "none" ]]; then
            echo "🚀 No compression – streaming raw file"
            wget -q -O - "$FILE_URL" | rclone rcat "$DEST_PATH" --progress

          # ---------- ZIP ----------
          elif [[ "$COMPRESS" == "zip" ]]; then
            # zip קורא מ‑stdin, יוצר zip על‑הדף, כותב ל‑stdout
            echo "📦 Compressing with ZIP (stream → zip → rclone)"
            wget -q -O - "$FILE_URL" | zip -q - - | rclone rcat "$DEST_PATH" --progress

          # ---------- TGZ ----------
          elif [[ "$COMPRESS" == "tgz" ]]; then
            echo "📦 Compressing with tar.gz (tgz) (stream → tar → gzip → rclone)"
            wget -q -O - "$FILE_URL" | tar -czf - - | rclone rcat "$DEST_PATH" --progress

          else
            echo "❗ Unknown compress option: $COMPRESS"
            exit 1
          fi
