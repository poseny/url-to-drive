name: Upload URL → Google Drive (auto‑extension – gzip / tgz)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL של הקובץ להורדה"
        required: true
        default: "https://ahblicklive.com/new_ded_video/26/23/VnOMPDVrju0PTSBRnvz/NNHEEG/480.mp4"
      compress:
        description: "סוג דחיסה – none | gzip | tgz"
        required: true
        default: "none"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣ התקנת rclone
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣ קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣ מציאת שם קובץ נכון (כולל סיומת אם יש דחיסה)
      # --------------------------------------------------------------
      - name: Determine final file name
        id: name_builder
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          COMPRESS: ${{ github.event.inputs.compress }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ----- שם הקובץ המקורי מה‑URL -----
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                # מסיר כל query string
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Raw name from URL = $raw_name"
          echo "📂 Decoded name      = $decoded_name"

          # ----- קביעת סיומת הדחיסה ----------
          case "$COMPRESS" in
            none)   EXT=""   ;;
            gzip)   EXT=".gz" ;;
            tgz)    EXT=".tgz" ;;
            *)      echo "❌ Unknown compress value: $COMPRESS" && exit 1 ;;
          esac

          # ----- שם קובץ סופי ----------
          final_name="${decoded_name}${EXT}"
          echo "📦 Final name that will be stored in Drive = $final_name"

          # שמירת ערכים לשימוש בשלבים הבאים
          echo "final_name=$final_name" >> $GITHUB_OUTPUT
          echo "remote_path=gdrive:${FOLDER}/${final_name}" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣ ניקוי קובץ קיים באותו שם (אם קיים)
      # --------------------------------------------------------------
      - name: Delete existing file (if any)
        env:
          REMOTE_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file to delete"
          fi

      # --------------------------------------------------------------
      # 5️⃣ הורדה → (דחיסה אם נדרש) → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Transfer (download → optional compress → upload)
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          COMPRESS: ${{ github.event.inputs.compress }}
          DEST_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          set -e
          echo "🚀 Starting transfer"
          echo "URL      = $FILE_URL"
          echo "COMPRESS = $COMPRESS"
          echo "DEST     = $DEST_PATH"

          if [[ "$COMPRESS" == "none" ]]; then
            # ללא שינוי – משדרים ישר ל‑rclone
            wget -q -O - "$FILE_URL" | rclone rcat "$DEST_PATH" --progress

          elif [[ "$COMPRESS" == "gzip" ]]; then
            # gzip יוצר קובץ .gz שמכיל את ה‑stream המקורי.
            # אחרי gunzip → הקובץ יחזור לשם המקורי (480.mp4)
            wget -q -O - "$FILE_URL" | gzip -c | rclone rcat "$DEST_PATH" --progress

          elif [[ "$COMPRESS" == "tgz" ]]; then
            # tar + gzip שומרים על שם הקובץ המקורי בתוך הארכיון
            wget -q -O - "$FILE_URL" | tar -czf - - | rclone rcat "$DEST_PATH" --progress
          else
            echo "❌ Unknown compress option"
            exit 1
          fi
