name: Upload URL → Google Drive (ZIP, keep original name)

# הפעלה ידנית עם שלושה קלטים:
# 1️⃣ url – כתובת הקובץ למקור
# 2️⃣ folder – תיקיית ה‑Drive שבה ניצור את קובץ ה‑ZIP
# 3️⃣ filename – (אופציונלי) שם קובץ לפני ה‑ZIP, ללא סיומת.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת ה‑URL של הקובץ להורדה"
        required: true
        default: "https://ahblicklive.com/new_ded_video/26/23/VnOMPDVrju0PTSBRnvz/NNHEEG/480.mp4"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ, לדוגמה MyUploads)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (לא חובה). אם ריק – נשתמש בשם מה‑URL."
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (zip כבר קיים במערכת)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  בניית שמות: שם קובץ ZIP + שם קובץ הפנימי בארכיון
      # --------------------------------------------------------------
      - name: Determine final names
        id: name_builder
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ----- שם הקובץ מה‑URL (לדוג例 480.mp4) -----
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                         # מסיר query‑string אם יש
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # אם המשתמש נתן שם קובץ – נשתמש בו, אחרת נשתמש בשם מה‑URL (בלי סיומת)
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"   # מסיר סיומת קיימת (למשל .mp4)
          fi

          zip_name="${base_name}.zip"        # שם קובץ ה‑ZIP במאגר Drive
          internal_name="$decoded_name"      # שם הקובץ שבתוך ה‑ZIP (כולל סיומת מקורית)

          echo "📦 ZIP name that will be stored in Drive = $zip_name"
          echo "📁 Internal file name inside ZIP           = $internal_name"

          # מרכיבים את הנתיב המלא ב‑Drive
          remote_path="gdrive:${FOLDER}/${zip_name}"

          # שמירת ערכים לשימוש בשלבים הבאים
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  (אופציונלי) מחיקת קובץ ZIP קיים באותו שם
      # --------------------------------------------------------------
      - name: Delete existing ZIP (if any)
        env:
          REMOTE_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous ZIP found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה → ZIP (עם שם פנימי) → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Transfer (download → zip → upload)
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.name_builder.outputs.internal_name }}
          DEST_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          set -e
          echo "🚀 Starting transfer"
          echo "URL           = $FILE_URL"
          echo "Internal name = $INTERNAL_NAME"
          echo "Destination   = $DEST_PATH"

          #   • wget   – קורא קובץ מה‑URL, פלט ל‑stdout
          #   • zip -j -q - "$INTERNAL_NAME" -   –  
          #        -j      : מתעלם משמות נתיב (הופך את שם הקובץ הפנימי לשם שנתת)
          #        -q      : שקט
          #        -       : קובץ ZIP נכתב ל‑stdout (מכוון ל‑rclone)
          #        "$INTERNAL_NAME" : שם הקובץ שמופיע בתוך ה‑ZIP
          #        -       : קובץ קלט – ה‑stream מתוך wget
          #   • rclone rcat – מעלה את ה‑ZIP ישירות ל‑Drive
          wget -q -O - "$FILE_URL" \
            | zip -j -q - "$INTERNAL_NAME" - \
            | rclone rcat "$DEST_PATH" --progress
