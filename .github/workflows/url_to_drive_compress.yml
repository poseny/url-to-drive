name: Upload URL → Google Drive (ZIP, keep original name)

# אפשר להריץ ידנית ולספק את ה‑URL, שם תיקייה ב‑Drive ואופן קידוד שם קובץ (אופציונלי)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת ה‑URL של הקובץ להורדה"
        required: true
        default: "https://ahblicklive.com/new_ded_video/26/23/VnOMPDVrju0PTSBRnvz/NNHEEG/480.mp4"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      # (אופציונלי) אם תרצה לשנות שם קובץ לפני ה‑ZIP – אחרת ישמש שם הקובץ מה‑URL
      filename:
        description: "שם קובץ ייעודי (ללא סיומת). אם ריק – נלקח מה‑URL"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (כולל zip – כבר קיים ב‑Ubuntu)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  כתיבת קובץ קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  בניית שם קובץ ZIP ו‑internal‑name (השם שבתוך ה‑ZIP)
      # --------------------------------------------------------------
      - name: Determine final file names
        id: name_builder
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          FOLDER: ${{ github.event.inputs.folder }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          # ---- 3.1 – שם קובץ גלוי מה‑URL (לדוגמה 480.mp4) ----
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                # מסיר כל חלק אחרי סימן ?
          # decode כל %-code (לדוגמה %D7%AA → ת)
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # אם המשתמש נתן שם קובץ ידני – נשתמש בו, אחרת נשתמש בשם מה‑URL
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            # מסיר סיומת קיימת (אם יש) כדי שלא נכתוב שם כפול (*.mp4 → 480)
            base_name="${decoded_name%.*}"
          fi

          # שם הקובץ שבתוך ה‑ZIP – חייב להיות עם סיומת מקורית
          # אם decoded_name כבר כולל סיומת (למשל .mp4) – זה יהיה internal‑name
          internal_name="$decoded_name"

          # שם קובץ ה‑ZIP עצמו (base_name + .zip)
          zip_name="${base_name}.zip"

          echo "📦 ZIP file that will be stored in Drive = $zip_name"
          echo "📁 Internal file name inside ZIP            = $internal_name"

          # נתיב מלא ב‑Drive (folder/zip_name)
          remote_path="gdrive:${FOLDER}/${zip_name}"

          # שמירת ערכים לשימוש בשלבים הבאים
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  (אופציונלי) מחיקת קובץ קיים באותו שם לפני העלאה
      # --------------------------------------------------------------
      - name: Delete previous ZIP if it exists
        env:
          REMOTE_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה → ZIP עם internal‑name → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Download → zip (preserving inner name) → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.name_builder.outputs.internal_name }}
          DEST_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          set -e
          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"

          # ‑‑ קו־הפקודה של zip:
          #   * `-q` – silent
          #   * `-`   – שם קובץ פלט = stdout (ה‑ZIP נשלח ישירות ל‑rclone)
          #   * `"$INTERNAL_NAME"` – שם הקובץ הפנימי בתוך ה‑ZIP
          #   * `-`   – קובץ קלט באותו time‑stdin (ה‑stream של wget)
          wget -q -O - "$FILE_URL" | zip -q - "$INTERNAL_NAME" - | rclone rcat "$DEST_PATH" --progress
