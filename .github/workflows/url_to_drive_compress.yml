name: Upload URL → Drive (auto‑extension + correct archive entry)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL של הקובץ שרוצים להוריד"
        required: true
        default: "https://ahblicklive.com/new_ded_video/26/23/VnOMPDVrju0PTSBRnvz/NNHEEG/480.mp4"
      compress:
        description: "סוג דחיסה – none | zip | tgz"
        required: true
        default: "zip"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ). לדוגמה: MyUploads"
        required: true
        default: "MyUploads"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣ התקנת rclone (zip ו‑tar כבר ב‑ubuntu‑latest)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣ כתיבת קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣ בניית שם קובץ סופי (עם סיומת) ושם קובץ פנימי ל‑archive
      # --------------------------------------------------------------
      - name: Build file names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          COMPRESS: ${{ github.event.inputs.compress }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ---- שם קובץ מקור מה‑URL (decode אחוזים) ----
          raw_name=$(basename "$FILE_URL")                 # לדוגמה 480.mp4
          raw_name=${raw_name%%\?*}                        # חותך query‑string אם קיים
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 raw name from URL = $raw_name"
          echo "💡 decoded name      = $decoded_name"

          # ---- קביעת סיומת בהתאם לדחיסה ----
          case "$COMPRESS" in
            zip) EXT=".zip" ;;
            tgz) EXT=".tgz" ;;
            none) EXT="" ;;
            *) echo "❌ Invalid compress value: $COMPRESS" && exit 1 ;;
          esac

          # ---- שם קובץ חיצוני ב‑Drive (כולל סיומת) ----
          # אם יש compression – נסיר סיומת קיימת לפני הוספת החדשה
          if [[ -n "$EXT" ]]; then
            base_without_ext="${decoded_name%.*}"   # 480 (לפני .mp4)
            final_name="${base_without_ext}${EXT}"
          else
            final_name="${decoded_name}"
          fi

          # ---- שם קובץ פנימי בארכיון (רק כאשר יש compression) ----
          if [[ -n "$EXT" ]]; then
            # שם פנימי = שם הקובץ המקורי (ללא שינוי)
            inner_name="${decoded_name}"
          else
            inner_name=""   # לא דרוש כאשר אין compression
          fi

          echo "📂 final_name (will be stored in Drive) = $final_name"
          echo "📦 inner_name (name inside zip/tgz)   = $inner_name"

          echo "final_name=$final_name" >> $GITHUB_OUTPUT
          echo "inner_name=$inner_name" >> $GITHUB_OUTPUT
          echo "remote_path=gdrive:${FOLDER}/${final_name}" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣ (אופציונלי) מחיקת קובץ קיים באותו שם לפני העלאה
      # --------------------------------------------------------------
      - name: Delete existing remote file (if any)
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting previous $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file found"
          fi

      # --------------------------------------------------------------
      # 5️⃣ הורדה → (דחיסה אם נדרש, עם שם קובץ פנימי) → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Transfer (download → optional compress → upload)
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          COMPRESS: ${{ github.event.inputs.compress }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
          INNER: ${{ steps.names.outputs.inner_name }}
        run: |
          set -e
          echo "🔎 INPUTS"
          echo "URL      = $FILE_URL"
          echo "COMPRESS = $COMPRESS"
          echo "DEST     = $DEST_PATH"
          echo "INNER    = $INNER"

          # ---------- ללא דחיסה ----------
          if [[ "$COMPRESS" == "none" ]]; then
            echo "🚀 No compression – streaming raw file"
            wget -q -O - "$FILE_URL" | rclone rcat "$DEST_PATH" --progress

          # ---------- ZIP ----------
          elif [[ "$COMPRESS" == "zip" ]]; then
            # zip -q - -:desired_name   ← קורא stdin ושומר בשם הרצוי
            echo "📦 Compressing with ZIP → internal name: $INNER"
            wget -q -O - "$FILE_URL" | zip -q - -:"$INNER" | rclone rcat "$DEST_PATH" --progress

          # ---------- TGZ ----------
          elif [[ "$COMPRESS" == "tgz" ]]; then
            # tar יוצר קובץ בשם "-" (כי הקלט מ‑stdin)
            # באמצעות --transform משנים את השם ל‑$INNER
            echo "📦 Compressing with tar.gz → internal name: $INNER"
            wget -q -O - "$FILE_URL" \
              | tar -czf - --transform "s|^|$INNER|" - \
              | rclone rcat "$DEST_PATH" --progress

          else
            echo "❗ Unknown compress option: $COMPRESS"
            exit 1
          fi
