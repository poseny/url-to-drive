name: Upload URL → Google Drive (ZIP – media‑links for HTML pages)

# הפעלה ידנית דרך GitHub UI
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ או דף האינטרנט"
        required: true
        default: "https://commons.wikimedia.org/wiki/File:Bilby_Looking_for_food_at_night.webm"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לבסיס (בלי סיומת). אם ריק – יורד מה‑URL/כותרת הדף"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣ Install rclone (zip, curl, grep – כבר במערכת)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣ Write rclone config (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣ Determine the “base name” (for ZIP) and content type
      # --------------------------------------------------------------
      - name: Resolve base name & content type
        id: resolve
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          # ----- 3.1 – קבלת ה‑Content‑Type מה‑header -----
          CONTENT_TYPE=$(curl -sI -L "$FILE_URL" | awk -F': ' '/^[Cc]ontent-[Tt]ype/ {print $2}' | tr -d '\r')
          echo "🕵️ Content‑Type = $CONTENT_TYPE"

          # ----- 3.2 – שם בסיס ל‑ZIP --------------------
          #   אם קיבלנו שם ממשתמש → משתמשים בו.
          #   אחרת נשתמש בכותרת הדף אם זו HTML,
          #   או בשם הקובץ מה‑URL אם זה קובץ מדיה.
          if [[ -n "$USER_NAME" ]]; then
            BASE_NAME="$USER_NAME"
          else
            if [[ "$CONTENT_TYPE" == text/html* ]]; then
              # נשלוף את כותרת ה‑<title> – ישתמש ב‑lynx (קיים ב‑ubuntu‑latest)
              PAGE_TITLE=$(curl -sL "$FILE_URL" | lynx -dump -force_html -nolist -stdin | head -n 1 | tr -d '\n')
              # ניקוי תווים אסורים בקבצים
              CLEAN_TITLE=$(echo "$PAGE_TITLE" | tr -cd '[:alnum:] _-')
              BASE_NAME="${CLEAN_TITLE:-page}"
            else
              # קובץ מדיה – ניקוי שם מה‑URL
              raw_name=$(basename "$FILE_URL")
              raw_name=${raw_name%%\?*}
              BASE_NAME="${raw_name%.*}"
            fi
          fi

          echo "🔤 Base name for ZIP = $BASE_NAME"

          ZIP_NAME="${BASE_NAME}.zip"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "content_type=$CONTENT_TYPE" >> $GITHUB_OUTPUT
          echo "base_name=$BASE_NAME" >> $GITHUB_OUTPUT
          # נתיב על‑Drive
          echo "remote_path=gdrive:${{ github.event.inputs.folder }}/$ZIP_NAME" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣ Create a temporary working directory
      # --------------------------------------------------------------
      - name: Create temp directory
        id: tmpdir
        run: |
          TMPDIR=$(mktemp -d)
          echo "tmpdir=$TMPDIR" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 5️⃣ Download & (if HTML) extract media links → create ZIP
      # --------------------------------------------------------------
      - name: Download / extract / zip
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          CONTENT_TYPE: ${{ steps.resolve.outputs.content_type }}
          BASE_NAME: ${{ steps.resolve.outputs.base_name }}
          ZIP_NAME: ${{ steps.resolve.outputs.zip_name }}
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          set -e
          set -o pipefail

          cd "$TMPDIR"

          # ---------- 5.1 – קובץ מדיה רגיל ----------
          if [[ "$CONTENT_TYPE" != text/html* ]]; then
            echo "📥 Downloading binary media → $BASE_NAME"
            curl -L -s -o "$BASE_NAME" "$FILE_URL"

            echo "🗜️ Zipping media file"
            zip -j -q "$ZIP_NAME" "$BASE_NAME"
          else
            # ---------- 5.2 – דף HTML ----------
            echo "📄 Downloading HTML page"
            curl -L -s -o "page.html" "$FILE_URL"

            echo "🔎 Extracting direct‑media links from HTML"
            # חיפוש קישורים שמסתיימים בסיומת מדיה נפוצה
            # אפשר להרחיב את הרשימה לפי צורך
            MEDIA_REGEX='https?://[^"]+\.(webm|mp4|mkv|mov|avi|flv|wmv|jpg|jpeg|png|gif|svg|bmp|tif|tiff|pdf|mp3|ogg|wav|flac|aac)'
            grep -Eo "$MEDIA_REGEX" "page.html" | sort -u > "links.txt" || true

            # אם לא נמצא קישור – נכתוב הודעה ברורה
            if [[ ! -s "links.txt" ]]; then
              echo "No direct media links were found on the page." > "links.txt"
            fi

            echo "🗜️ Zipping the links.txt file"
            zip -j -q "$ZIP_NAME" "links.txt"
          fi

          # בדיקה – הקובץ ZIP קיים ולא ריק
          if [[ ! -s "$ZIP_NAME" ]]; then
            echo "❌ ZIP creation failed – file size is zero"
            exit 1
          fi

      # --------------------------------------------------------------
      # 6️⃣ Upload the ZIP to Google Drive
      # --------------------------------------------------------------
      - name: Upload ZIP to Drive
        env:
          REMOTE_PATH: ${{ steps.resolve.outputs.remote_path }}
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          set -e
          cd "$TMPDIR"
          echo "🚀 Uploading $ZIP_NAME to $REMOTE_PATH"
          rclone copy "$ZIP_NAME" "$REMOTE_PATH" --progress

      # --------------------------------------------------------------
      # 7️⃣ Clean‑up (optional – runner wipes /tmp automatically)
      # --------------------------------------------------------------
      - name: Clean temporary files
        if: always()
        env:
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          rm -rf "$TMPDIR" || true
