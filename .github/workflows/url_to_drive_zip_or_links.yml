name: Upload URL → Google Drive (ZIP – media‑links for HTML pages)

# מאפשר הרצה ידנית (גורם לכפתור “Run workflow”)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של קובץ מדיה או של דף HTML"
        required: true
        default: "https://commons.wikimedia.org/wiki/File:Bilby_Looking_for_food_at_night.webm"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לבסיס (בלי סיומת). אם ריק – ייקח מה‑URL/כותרת הדף"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------------
      # 0️⃣  Checkout (רק בשביל שה‑run יופיע ברשימת Actions)
      # --------------------------------------------------------------
      - name: Checkout repository (required for UI)
        uses: actions/checkout@v3

      # --------------------------------------------------------------
      # 1️⃣  Install rclone + lynx (לצורך חילוץ כותרת HTML)
      # --------------------------------------------------------------
      - name: Install rclone and lynx
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq
          sudo apt-get install -y lynx

      # --------------------------------------------------------------
      # 2️⃣  Write rclone config (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  Resolve content‑type and decide base name for the ZIP
      # --------------------------------------------------------------
      - name: Resolve content‑type & base name
        id: resolve
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          # --------- 3.1 – קבלת Content‑Type ----------
          # -L עוקב אחרי הפניות, -I מבקש רק את ה‑headers
          CONTENT_TYPE=$(curl -sI -L "$FILE_URL" | awk -F': ' '/^[Cc]ontent-[Tt]ype/ {print $2}' | tr -d '\r')
          echo "🕵️‍♂️ Content‑Type = $CONTENT_TYPE"

          # --------- 3.2 – בניית שם בסיס (Base name) ----------
          if [[ -n "$USER_NAME" ]]; then
            BASE_NAME="$USER_NAME"
          else
            if [[ "$CONTENT_TYPE" == text/html* ]]; then
              # דף HTML – נשלוף את כותרת <title>
              PAGE_TITLE=$(curl -sL "$FILE_URL" | lynx -dump -force_html -nolist -stdin | head -n 1)
              # ניקוי תווים שלא יורידו קובץ
              CLEAN_TITLE=$(echo "$PAGE_TITLE" | tr -cd '[:alnum:] _-')
              BASE_NAME="${CLEAN_TITLE:-page}"
            else
              # קובץ מדיה – שם הקובץ מה‑URL
              raw_name=$(basename "$FILE_URL")
              raw_name=${raw_name%%\?*}            # החלק לפני ? אם קיים
              BASE_NAME="${raw_name%.*}"           # ללא סיומת
            fi
          fi

          ZIP_NAME="${BASE_NAME}.zip"
          echo "🔤 Base name  = $BASE_NAME"
          echo "📦 ZIP name   = $ZIP_NAME"

          echo "zip_name=$ZIP_NAME"          >> $GITHUB_OUTPUT
          echo "content_type=$CONTENT_TYPE"  >> $GITHUB_OUTPUT
          echo "base_name=$BASE_NAME"        >> $GITHUB_OUTPUT
          echo "remote_path=gdrive:${{ github.event.inputs.folder }}/$ZIP_NAME" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  Prepare a temporary working directory
      # --------------------------------------------------------------
      - name: Create temporary directory
        id: tmpdir
        run: |
          TMPDIR=$(mktemp -d)
          echo "tmpdir=$TMPDIR" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 5️⃣  Download → (if HTML) extract links → ZIP → upload
      # --------------------------------------------------------------
      - name: Download / extract / zip
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          CONTENT_TYPE: ${{ steps.resolve.outputs.content_type }}
          BASE_NAME: ${{ steps.resolve.outputs.base_name }}
          ZIP_NAME: ${{ steps.resolve.outputs.zip_name }}
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          set -e
          set -o pipefail

          cd "$TMPDIR"

          # ---------- קובץ מדיה (לא HTML) ----------
          if [[ "$CONTENT_TYPE" != text/html* ]]; then
            echo "📥 Downloading binary media → $BASE_NAME"
            curl -L -s -o "$BASE_NAME" "$FILE_URL"

            echo "🗜️ Creating ZIP with the media file"
            zip -j -q "$ZIP_NAME" "$BASE_NAME"

          else
            # ---------- דף HTML ----------
            echo "📄 Downloading HTML page"
            curl -L -s -o "page.html" "$FILE_URL"

            echo "🔎 Extracting direct‑media links from HTML"
            # רשימת סיומות מדיה שנרצה לתפוס – אפשר להרחיב
            MEDIA_REGEX='https?://[^"]+\.(webm|mp4|mkv|mov|avi|flv|wmv|jpg|jpeg|png|gif|svg|bmp|tif|tiff|pdf|mp3|ogg|wav|flac|aac)'
            grep -Eo "$MEDIA_REGEX" "page.html" | sort -u > "links.txt" || true

            # אם לא מצאנו קישורים – נכתוב הודעה ברורה בקובץ
            if [[ ! -s "links.txt" ]]; then
              echo "No direct media links were found on the page." > "links.txt"
            fi

            echo "🗜️ Zipping the links.txt file"
            zip -j -q "$ZIP_NAME" "links.txt"
          fi

          # אימות – הקובץ ZIP קיים ושגודלו גדול מ‑0
          if [[ ! -s "$ZIP_NAME" ]]; then
            echo "❌ ZIP creation failed – file size is zero"
            exit 1
          fi

      # --------------------------------------------------------------
      # 6️⃣  Upload the ZIP to Google Drive
      # --------------------------------------------------------------
      - name: Upload ZIP to Drive
        env:
          REMOTE_PATH: ${{ steps.resolve.outputs.remote_path }}
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          set -e
          cd "$TMPDIR"
          echo "🚀 Uploading $ZIP_NAME → $REMOTE_PATH"
          rclone copy "$ZIP_NAME" "$REMOTE_PATH" --progress

      # --------------------------------------------------------------
      # 7️⃣  Clean‑up (optional – runner wipes /tmp automatically)
      # --------------------------------------------------------------
      - name: Clean temporary files
        if: always()
        env:
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          rm -rf "$TMPDIR" || true
