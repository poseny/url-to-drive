name: Upload URL → Google Drive (clean links, no zip)

# הרצה ידנית מה‑UI של GitHub
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של קובץ מדיה או של דף HTML"
        required: true
        default: "https://commons.wikimedia.org/wiki/File:Bilby_Looking_for_food_at_night.webm"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לבסיס (בלי סיומת). אם ריק – ייקח מה‑URL/כותרת הדף"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 0️⃣  Checkout – רק בשביל שה‑UI של GitHub יראה את ה‑workflow
      # --------------------------------------------------------------
      - name: Checkout repository (required for UI)
        uses: actions/checkout@v3

      # --------------------------------------------------------------
      # 1️⃣  Install rclone + lynx (חילוץ כותרת HTML)
      # --------------------------------------------------------------
      - name: Install rclone and lynx
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq
          sudo apt-get install -y lynx

      # --------------------------------------------------------------
      # 2️⃣  Write rclone config (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  Resolve content‑type ובחירת שם בסיס (base name)
      # --------------------------------------------------------------
      - name: Resolve content‑type & base name
        id: resolve
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          # --- 3.1 – קבלת Content‑Type ----------------------------
          CONTENT_TYPE=$(curl -sI -L "$FILE_URL" \
                          | awk -F': ' '/^[Cc]ontent-[Tt]ype/ {print $2}' \
                          | tr -d '\r')
          echo "🕵️ Content‑Type = $CONTENT_TYPE"

          # --- 3.2 – בחירת שם בסיס (Base name) -------------------
          if [[ -n "$USER_NAME" ]]; then
            BASE_NAME="$USER_NAME"
          else
            if [[ "$CONTENT_TYPE" == text/html* ]]; then
              # דף HTML – חילוץ <title>
              PAGE_TITLE=$(curl -sL "$FILE_URL" | lynx -dump -force_html -nolist -stdin | head -n 1)
              CLEAN_TITLE=$(echo "$PAGE_TITLE" | tr -cd '[:alnum:] _-')
              BASE_NAME="${CLEAN_TITLE:-page}"
            else
              # קובץ מדיה – שם קובץ מה‑URL ללא סיומת
              raw_name=$(basename "$FILE_URL")
              raw_name=${raw_name%%\?*}
              BASE_NAME="${raw_name%.*}"
            fi
          fi

          echo "🔤 Base name = $BASE_NAME"
          echo "base_name=$BASE_NAME" >> $GITHUB_OUTPUT
          echo "content_type=$CONTENT_TYPE" >> $GITHUB_OUTPUT
          # נתיב על‑Drive – נשתמש בו ב‑step 6
          echo "remote_base=gdrive:${{ github.event.inputs.folder }}/$BASE_NAME" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  Create temporary working directory
      # --------------------------------------------------------------
      - name: Create temporary directory
        id: tmpdir
        run: |
          TMPDIR=$(mktemp -d)
          echo "tmpdir=$TMPDIR" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 5️⃣  Download → (if HTML) extract **clean** links → upload
      # --------------------------------------------------------------
      - name: Download / extract clean links / upload (no zip)
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          CONTENT_TYPE: ${{ steps.resolve.outputs.content_type }}
          BASE_NAME: ${{ steps.resolve.outputs.base_name }}
          REMOTE_BASE: ${{ steps.resolve.outputs.remote_base }}
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          set -e
          set -o pipefail
          cd "$TMPDIR"

          # ------------------- קובץ מדיה ---------------------------
          if [[ "$CONTENT_TYPE" != text/html* ]]; then
            echo "📥 Downloading media file → $BASE_NAME"
            curl -L -s -o "$BASE_NAME" "$FILE_URL"

            echo "🚀 Uploading media file directly to Drive"
            rclone copy "$BASE_NAME" "$REMOTE_BASE" --progress

          # ------------------- דף HTML ----------------------------
          else
            echo "📄 Downloading HTML page"
            curl -L -s -o "page.html" "$FILE_URL"

            echo "🔎 Extracting **clean** direct‑media links"
            # רשימת סיומות למדיה – ניתן להוסיף אם צריך
            MEDIA_REGEX='https?://[^"]+\.(webm|mp4|mkv|mov|avi|flv|wmv|jpg|jpeg|png|gif|svg|bmp|tif|tiff|pdf|mp3|ogg|wav|flac|aac|html|apk|gguf)'

            # 1️⃣ grep מוצא את כל הקישורים עם סיומת מדיה
            # 2️⃣ sed מוסיר כל מה שמופיע אחרי ? או # או & (נקודק נקודה)
            # 3️⃣ sort -u מסיר כפילויות, משאיר כל קישור על שורה משלו
            grep -Eo "$MEDIA_REGEX" "page.html" \
                | sed -E 's/[?&#].*$//' \
                | sort -u > "links.txt"

            # אם אחרי הניקוי הקובץ ריק – נכתוב הודעה ברורה
            if [[ ! -s "links.txt" ]]; then
              echo "No clean direct media links were found on the page." > "links.txt"
            fi

            echo "🚀 Uploading the cleaned links file as ${BASE_NAME}.txt"
            rclone copy "links.txt" "${REMOTE_BASE}.txt" --progress
          fi

      # --------------------------------------------------------------
      # 6️⃣  Clean‑up (runner יסגור את /tmp אוטומטית, רק לשם שכמט)
      # --------------------------------------------------------------
      - name: Clean temporary files
        if: always()
        env:
          TMPDIR: ${{ steps.tmpdir.outputs.tmpdir }}
        run: |
          rm -rf "$TMPDIR" || true
