name: Debug Force Push

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yt-dlp
        run: pip3 install --upgrade yt-dlp

      - name: Download and update README
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          yt-dlp --no-playlist -f "bestaudio/best" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1 | tee /tmp/log.txt
          
          echo "# YouTube Debug Log" > README.md
          echo "" >> README.md
          echo "Generated: $(date)" >> README.md
          echo "" >> README.md
          echo '```' >> README.md
          cat /tmp/log.txt >> README.md
          echo '```' >> README.md

      - name: Force commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update README with youtube log" --allow-empty
          git push --force
