name: Debug Artifact Log

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pip3 install --upgrade yt-dlp

      - name: Download and save log
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          yt-dlp --no-playlist -f "bestaudio/best" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1 | tee /tmp/log.txt
          cp /tmp/log.txt youtube_log.txt

      - name: Upload log as artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-log
          path: youtube_log.txt
