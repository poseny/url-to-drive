- name: Debug formats
  run: |
    mkdir -p /tmp/test
    cd /tmp/test

    echo "=== YT-DLP VERSION ==="
    yt-dlp --version

    echo "=== NODE VERSION ==="
    node --version

    echo "=== LIST FORMATS ==="
    yt-dlp --cookies "$GITHUB_WORKSPACE/cookies_new.txt" --extractor-args "youtube:player_client=web" --skip-download --list-formats "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1 | tee /tmp/list_formats.txt

    echo "=== FORMAT EXIT CODE: ${PIPESTATUS[0]} ==="

- name: Download with cookies
  continue-on-error: true
  run: |
    mkdir -p /tmp/test
    cd /tmp/test

    echo "=== DOWNLOAD ==="
    yt-dlp --cookies "$GITHUB_WORKSPACE/cookies_new.txt" --extractor-args "youtube:player_client=web" --no-playlist -f "bestaudio/best" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1 | tee /tmp/log.txt

    echo "=== DOWNLOAD EXIT CODE: ${PIPESTATUS[0]} ==="
