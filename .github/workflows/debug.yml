name: Debug Cookies V2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: main

      - name: Run full debug and create logs
        if: always()
        run: |
          set +e

          echo "=== GITHUB INFO ===" | tee /tmp/install.log
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" | tee -a /tmp/install.log
          echo "GITHUB_REF=$GITHUB_REF" | tee -a /tmp/install.log
          echo "GITHUB_SHA=$GITHUB_SHA" | tee -a /tmp/install.log
          pwd | tee -a /tmp/install.log
          ls -la "$GITHUB_WORKSPACE" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== PYTHON / PIP ===" | tee -a /tmp/install.log

          python3 --version 2>&1 | tee -a /tmp/install.log
          echo "PYTHON EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          python3 -m pip --version 2>&1 | tee -a /tmp/install.log
          echo "PIP VERSION EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== PIP UPGRADE ===" | tee -a /tmp/install.log

          python3 -m pip install --upgrade pip 2>&1 | tee -a /tmp/install.log
          echo "PIP UPGRADE EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== INSTALL YT-DLP WITH ESO ===" | tee -a /tmp/install.log

          python3 -m pip install --upgrade "yt-dlp[default+ESO]" 2>&1 | tee -a /tmp/install.log
          echo "YT-DLP INSTALL EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== INSTALL NODEJS ===" | tee -a /tmp/install.log

          sudo apt-get update 2>&1 | tee -a /tmp/install.log
          echo "APT UPDATE EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          sudo apt-get install -y nodejs 2>&1 | tee -a /tmp/install.log
          echo "APT INSTALL NODEJS EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== VERSIONS ===" | tee -a /tmp/install.log

          node --version 2>&1 | tee -a /tmp/install.log
          echo "NODE EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          yt-dlp --version 2>&1 | tee -a /tmp/install.log
          echo "YT-DLP VERSION EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== CHECK COOKIES FILE ===" | tee -a /tmp/install.log

          if [ -f "$GITHUB_WORKSPACE/cookies_new.txt" ]; then
            echo "cookies_new.txt found" | tee -a /tmp/install.log
            ls -l "$GITHUB_WORKSPACE/cookies_new.txt" | tee -a /tmp/install.log
            wc -c "$GITHUB_WORKSPACE/cookies_new.txt" | tee -a /tmp/install.log
          else
            echo "ERROR: cookies_new.txt not found at $GITHUB_WORKSPACE/cookies_new.txt" | tee -a /tmp/install.log
          fi

          mkdir -p /tmp/test
          cd /tmp/test

          echo "" | tee /tmp/list_formats.txt
          echo "=== LIST FORMATS ===" | tee -a /tmp/list_formats.txt

          yt-dlp --version 2>&1 | tee -a /tmp/list_formats.txt
          echo "YT-DLP VERSION EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/list_formats.txt

          yt-dlp \
            --cookies "$GITHUB_WORKSPACE/cookies_new.txt" \
            --extractor-args "youtube:player_client=web" \
            --skip-download \
            --list-formats \
            "https://www.youtube.com/watch?v=I60j6jur_TY" \
            2>&1 | tee -a /tmp/list_formats.txt

          echo "" | tee -a /tmp/list_formats.txt
          echo "=== FORMAT EXIT CODE: ${PIPESTATUS[0]} ===" | tee -a /tmp/list_formats.txt

          echo "" > /tmp/log.txt
          echo "=== DOWNLOAD ===" | tee -a /tmp/log.txt

          yt-dlp \
            --cookies "$GITHUB_WORKSPACE/cookies_new.txt" \
            --extractor-args "youtube:player_client=web" \
            --no-playlist \
            -f "bestaudio/best" \
            -o "test.%(ext)s" \
            "https://www.youtube.com/watch?v=I60j6jur_TY" \
            2>&1 | tee -a /tmp/log.txt

          echo "" | tee -a /tmp/log.txt
          echo "=== DOWNLOAD EXIT CODE: ${PIPESTATUS[0]} ===" | tee -a /tmp/log.txt

      - name: Send email
        if: always()
        env:
          EMAIL_FROM: p0556722432@gmail.com
          EMAIL_TO: p0556722432@gmail.com
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python3 << 'EOF'
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os

          paths = [
              "/tmp/install.log",
              "/tmp/list_formats.txt",
              "/tmp/log.txt"
          ]

          log_content = ""

          for path in paths:
              if os.path.exists(path):
                  with open(path, "r", errors="replace") as f:
                      log_content += f"\n\n========== {path} ==========\n"
                      log_content += f.read()
              else:
                  log_content += f"\n\n========== {path} MISSING ==========\n"

          msg = MIMEMultipart()
          msg["From"] = os.environ["EMAIL_FROM"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg["Subject"] = "YouTube Debug Log V2"

          msg.attach(MIMEText(log_content, "plain"))

          try:
              server = smtplib.SMTP("smtp.gmail.com", 587)
              server.starttls()
              server.login(os.environ["EMAIL_FROM"], os.environ["EMAIL_PASSWORD"])
              server.sendmail(
                  os.environ["EMAIL_FROM"],
                  os.environ["EMAIL_TO"],
                  msg.as_string()
              )
              server.quit()
              print("EMAIL SENT")
          except Exception as e:
              print(f"EMAIL FAILED: {e}")
          EOF
