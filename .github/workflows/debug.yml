name: Debug YouTube Alternative

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pip3 install --upgrade yt-dlp

      - name: Try different format
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          
          echo "=== Attempt 1: worst quality ==="
          yt-dlp --no-playlist -f "worst" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1
          
          echo "=== Files ==="
          ls -la /tmp/test/
