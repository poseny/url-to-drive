name: Debug with log file

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: |
          pip3 install --upgrade yt-dlp
          yt-dlp --version

      - name: Download YouTube and save log
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          
          yt-dlp \
            --verbose \
            --no-playlist \
            -f "bestaudio/best" \
            -o "test.%(ext)s" \
            "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1 | tee /tmp/download_log.txt
          
          echo "=== FILES ===" >> /tmp/download_log.txt
          ls -la /tmp/test/ >> /tmp/download_log.txt
          
          echo "=== LOG SAVED ==="

      - name: Upload log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-log
          path: /tmp/download_log.txt
