name: Debug Cookies V2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: main

      - name: Install dependencies and create install.log
        if: always()
        run: |
          set +e

          echo "=== GITHUB INFO ===" | tee /tmp/install.log
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" | tee -a /tmp/install.log
          echo "GITHUB_REF=$GITHUB_REF" | tee -a /tmp/install.log
          echo "GITHUB_SHA=$GITHUB_SHA" | tee -a /tmp/install.log
          pwd | tee -a /tmp/install.log
          ls -la "$GITHUB_WORKSPACE" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== PYTHON / PIP ===" | tee -a /tmp/install.log

          python3 --version 2>&1 | tee -a /tmp/install.log
          echo "PYTHON EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          python3 -m pip --version 2>&1 | tee -a /tmp/install.log
          echo "PIP VERSION EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== PIP UPGRADE ===" | tee -a /tmp/install.log

          python3 -m pip install --user --upgrade pip 2>&1 | tee -a /tmp/install.log
          PIP_UPGRADE_STATUS=${PIPESTATUS[0]}
          echo "PIP UPGRADE EXIT CODE: $PIP_UPGRADE_STATUS" | tee -a /tmp/install.log

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "Added $HOME/.local/bin to PATH" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== INSTALL YT-DLP WITH ESO ===" | tee -a /tmp/install.log

          python3 -m pip install --user --upgrade "yt-dlp[default,ESO]" 2>&1 | tee -a /tmp/install.log
          YT_DLP_INSTALL_STATUS=${PIPESTATUS[0]}
          echo "YT-DLP INSTALL EXIT CODE: $YT_DLP_INSTALL_STATUS" | tee -a /tmp/install.log

          if [ "$YT_DLP_INSTALL_STATUS" -ne 0 ]; then
            echo "" | tee -a /tmp/install.log
            echo "First yt-dlp install failed. Trying fallback: yt-dlp + yt-dlp-ejs" | tee -a /tmp/install.log

            python3 -m pip install --user --upgrade yt-dlp yt-dlp-ejs 2>&1 | tee -a /tmp/install.log
            YT_DLP_FALLBACK_STATUS=${PIPESTATUS[0]}
            echo "YT-DLP FALLBACK INSTALL EXIT CODE: $YT_DLP_FALLBACK_STATUS" | tee -a /tmp/install.log
          fi

          echo "" | tee -a /tmp/install.log
          echo "=== INSTALL NODEJS ===" | tee -a /tmp/install.log

          sudo apt-get update 2>&1 | tee -a /tmp/install.log
          APT_UPDATE_STATUS=${PIPESTATUS[0]}
          echo "APT UPDATE EXIT CODE: $APT_UPDATE_STATUS" | tee -a /tmp/install.log

          sudo apt-get install -y nodejs 2>&1 | tee -a /tmp/install.log
          APT_INSTALL_NODEJS_STATUS=${PIPESTATUS[0]}
          echo "APT INSTALL NODEJS EXIT CODE: $APT_INSTALL_NODEJS_STATUS" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== VERSIONS ===" | tee -a /tmp/install.log

          export PATH="$HOME/.local/bin:$PATH"
          echo "PATH=$PATH" | tee -a /tmp/install.log

          node --version 2>&1 | tee -a /tmp/install.log
          echo "NODE EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          YTDLP=(python3 -m yt_dlp)

          "${YTDLP[@]}" --version 2>&1 | tee -a /tmp/install.log
          echo "YT-DLP VERSION EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/install.log

          echo "" | tee -a /tmp/install.log
          echo "=== CHECK COOKIES FILE ===" | tee -a /tmp/install.log

          COOKIE_FILE="$GITHUB_WORKSPACE/cookies_new.txt"

          if [ -f "$COOKIE_FILE" ]; then
            echo "cookies_new.txt found" | tee -a /tmp/install.log
            echo "COOKIE_FILE=$COOKIE_FILE" | tee -a /tmp/install.log
            ls -l "$COOKIE_FILE" | tee -a /tmp/install.log
            wc -c "$COOKIE_FILE" | tee -a /tmp/install.log
          elif [ -f "$GITHUB_WORKSPACE/www.youtube.com_cookies.txt" ]; then
            echo "cookies_new.txt not found, using www.youtube.com_cookies.txt" | tee -a /tmp/install.log
            COOKIE_FILE="$GITHUB_WORKSPACE/www.youtube.com_cookies.txt"
            echo "COOKIE_FILE=$COOKIE_FILE" | tee -a /tmp/install.log
            ls -l "$COOKIE_FILE" | tee -a /tmp/install.log
            wc -c "$COOKIE_FILE" | tee -a /tmp/install.log
          else
            echo "ERROR: no cookies file found" | tee -a /tmp/install.log
            echo "Checked:" | tee -a /tmp/install.log
            echo "$GITHUB_WORKSPACE/cookies_new.txt" | tee -a /tmp/install.log
            echo "$GITHUB_WORKSPACE/www.youtube.com_cookies.txt" | tee -a /tmp/install.log
          fi

          mkdir -p /tmp/test
          cd /tmp/test

          echo "" | tee /tmp/list_formats.txt
          echo "=== LIST FORMATS ===" | tee -a /tmp/list_formats.txt

          "${YTDLP[@]}" --version 2>&1 | tee -a /tmp/list_formats.txt
          echo "YT-DLP VERSION EXIT CODE: ${PIPESTATUS[0]}" | tee -a /tmp/list_formats.txt

          "${YTDLP[@]}" \
            --cookies "$COOKIE_FILE" \
            --extractor-args "youtube:player_client=web" \
            --skip-download \
            --list-formats \
            "https://www.youtube.com/watch?v=I60j6jur_TY" \
            2>&1 | tee -a /tmp/list_formats.txt

          FORMAT_STATUS=${PIPESTATUS[0]}
          echo "" | tee -a /tmp/list_formats.txt
          echo "=== FORMAT EXIT CODE: $FORMAT_STATUS ===" | tee -a /tmp/list_formats.txt

          echo "" > /tmp/log.txt
          echo "=== DOWNLOAD ===" | tee -a /tmp/log.txt

          "${YTDLP[@]}" \
            --cookies "$COOKIE_FILE" \
            --extractor-args "youtube:player_client=web" \
            --no-playlist \
            -f "bestaudio/best" \
            -o "test.%(ext)s" \
            "https://www.youtube.com/watch?v=I60j6jur_TY" \
            2>&1 | tee -a /tmp/log.txt

          DOWNLOAD_STATUS=${PIPESTATUS[0]}
          echo "" | tee -a /tmp/log.txt
          echo "=== DOWNLOAD EXIT CODE: $DOWNLOAD_STATUS ===" | tee -a /tmp/log.txt

      - name: Send email
        if: always()
        env:
          EMAIL_FROM: p0556722432@gmail.com
          EMAIL_TO: p0556722432@gmail.com
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python3 << 'EOF'
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os

          paths = [
              "/tmp/install.log",
              "/tmp/list_formats.txt",
              "/tmp/log.txt"
          ]

          log_content = ""

          for path in paths:
              if os.path.exists(path):
                  with open(path, "r", errors="replace") as f:
                      log_content += f"\n\n========== {path} ==========\n"
                      log_content += f.read()
              else:
                  log_content += f"\n\n========== {path} MISSING ==========\n"

          msg = MIMEMultipart()
          msg["From"] = os.environ["EMAIL_FROM"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg["Subject"] = "YouTube Debug Log V2"

          msg.attach(MIMEText(log_content, "plain"))

          try:
              server = smtplib.SMTP("smtp.gmail.com", 587)
              server.starttls()
              server.login(os.environ["EMAIL_FROM"], os.environ["EMAIL_PASSWORD"])
              server.sendmail(
                  os.environ["EMAIL_FROM"],
                  os.environ["EMAIL_TO"],
                  msg.as_string()
              )
              server.quit()
              print("EMAIL SENT")
          except Exception as e:
              print(f"EMAIL FAILED: {e}")
          EOF
