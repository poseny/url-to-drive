name: Debug Super Simple

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pip3 install --upgrade yt-dlp

      - name: Download YouTube
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          yt-dlp --no-playlist -f "bestaudio/best" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY"
          echo "DOWNLOAD EXIT CODE: $?"
          echo "FILES:"
          ls -la /tmp/test/
