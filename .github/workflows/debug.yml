name: Debug Other Video

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pip3 install --upgrade yt-dlp

      - name: Download other video
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          yt-dlp --no-playlist -f "bestaudio/best" -o "test.%(ext)s" "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 2>&1 | tee /tmp/log.txt
          
          echo "=== EXIT CODE: $? ==="

      - name: Send email
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python3 << 'EOF'
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os

          with open('/tmp/log.txt', 'r') as f:
              log_content = f.read()

          msg = MIMEMultipart()
          msg['From'] = 'p0556722432@gmail.com'
          msg['To'] = 'p0556722432@gmail.com'
          msg['Subject'] = 'YouTube Debug Log - Other Video'

          msg.attach(MIMEText(log_content, 'plain'))

          try:
              server = smtplib.SMTP('smtp.gmail.com', 587)
              server.starttls()
              server.login('p0556722432@gmail.com', os.environ['EMAIL_PASSWORD'])
              server.sendmail('p0556722432@gmail.com', 'p0556722432@gmail.com', msg.as_string())
              server.quit()
              print("EMAIL SENT")
          except Exception as e:
              print(f"EMAIL FAILED: {e}")
          EOF
