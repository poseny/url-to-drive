name: YouTube Download via Tor – Safe Timeout & Fresh Cookies

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30               # כיבוי ג׳וב אם משהו ממשיך יותר מדי
    env:
      EMAIL_FROM: p0556722432@gmail.com
      EMAIL_TO:   p0556722432@gmail.com
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      # --------------------------------------------------------------
      # 1️⃣ Checkout
      # --------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      # --------------------------------------------------------------
      # 2️⃣ Install system utilities (tor, curl, netcat, timeout)
      # --------------------------------------------------------------
      - name: Install utils
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tor curl netcat-openbsd coreutils

      # --------------------------------------------------------------
      # 3️⃣ Configure Tor (US exit + ControlPort) and start it
      # --------------------------------------------------------------
      - name: Configure & start Tor
        run: |
          sudo bash -c 'echo "ExitNodes {us}" >> /etc/tor/torrc'
          sudo bash -c 'echo "StrictNodes 1"   >> /etc/tor/torrc'
          sudo bash -c 'echo "ControlPort 9051" >> /etc/tor/torrc'
          sudo bash -c 'echo "CookieAuthentication 0" >> /etc/tor/torrc'
          sudo service tor restart
          # wait until listening on 9050
          for i in $(seq 1 9); do
            sudo netstat -tlnp | grep -q 9050 && break
            sleep 5
          done
          # quick sanity check
          if curl --silent --socks5 127.0.0.1:9050 https://check.torproject.org | grep -q "Congratulations"; then
            echo "✅ Tor is up"
          else
            echo "⚠️ Tor test failed – will still try (direct fallback later)."
          fi

      # --------------------------------------------------------------
      # 4️⃣ Install Python + yt‑dlp + plugin
      # --------------------------------------------------------------
      - name: Install Python deps
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "yt-dlp[default]" yt-dlp-ejs
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # --------------------------------------------------------------
      # 5️⃣ Decode cookies (Base64 → cookies.txt)
      # --------------------------------------------------------------
      - name: Decode cookies.txt from secret
        id: decode
        env:
          COOKIE_B64: ${{ secrets.COOKIE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${COOKIE_B64:-}" ]]; then
            echo "❌ Secret COOKIE_B64 missing"
            echo "cookie_file=" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "$COOKIE_B64" | base64 -d > /tmp/yt_cookies.txt
          if [[ -s /tmp/yt_cookies.txt ]]; then
            echo "✅ Cookies decoded → /tmp/yt_cookies.txt"
            echo "cookie_file=/tmp/yt_cookies.txt" >> $GITHUB_OUTPUT
          else
            echo "❌ Decoded file empty"
            echo "cookie_file=" >> $GITHUB_OUTPUT
            exit 1
          fi

      # --------------------------------------------------------------
      # 6️⃣ Generate a tiny install.log (so the e‑mail is never empty)
      # --------------------------------------------------------------
      - name: Generate install.log
        run: |
          {
            echo "=== GITHUB INFO ==="
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "GITHUB_REF=$GITHUB_REF"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "PYTHON=$(python3 --version)"
            echo "PIP=$(python3 -m pip --version)"
          } > /tmp/install.log

      # --------------------------------------------------------------
      # 7️⃣ (אופציונלי) בדיקת Tor connectivity – אם נכשל, נעבור ל‑direct
      # --------------------------------------------------------------
      - name: Quick Tor connectivity test
        id: torcheck
        run: |
          set -e
          if curl --max-time 8 --silent --socks5 127.0.0.1:9050 https://www.google.com > /dev/null; then
            echo "tor_up=true" >> $GITHUB_OUTPUT
          else
            echo "tor_up=false" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------------------
      # 8️⃣ DEBUG – versions & cookie sanity
      # --------------------------------------------------------------
      - name: Debug versions & cookie file
        run: |
          set -e
          echo "Python   : $(python3 --version)"
          echo "yt‑dlp   : $(python3 -m yt_dlp --version)"
          if [[ -n "${{ steps.decode.outputs.cookie_file }}" && -f "${{ steps.decode.outputs.cookie_file }}" ]]; then
            echo "Cookie file size:"
            wc -c "${{ steps.decode.outputs.cookie_file }}"
            echo "First 5 lines (sanitized):"
            head -n 5 "${{ steps.decode.outputs.cookie_file }}" | sed 's/[^\t]*/*** /g'
          else
            echo "⚠️ No cookie file found"
          fi

      # --------------------------------------------------------------
      # 9️⃣ Refresh Tor circuit (NEWNYM) – **לפני** כל ניסיון הורדה
      # --------------------------------------------------------------
      - name: Refresh Tor circuit (NEWNYM)
        if: steps.torcheck.outputs.tor_up == 'true'
        run: |
          # אם ControlPort פתוח אנו מבקשים circuit חדש
          if sudo netstat -tlnp | grep -q 9051; then
            echo "AUTHENTICATE \"\"" | nc localhost 9051
            echo "SIGNAL NEWNYM" | nc localhost 9051
            sleep 5   # לתת ל‑circuit להתייצב
            echo "✅ NEWNYM requested"
          else
            echo "⚠️ ControlPort 9051 not open – skipping NEWNYM"
          fi

      # --------------------------------------------------------------
      # 🔟 ***הורדה עם timeout קמיע*** – נשתמש ב‑`timeout` של Bash
      # --------------------------------------------------------------
      - name: Download with yt‑dlp (Tor) – limited retries
        id: dl
        # אם Tor לא פועל, נמשיך עם direct (שלב fallback במידה וה‑if נכשל)
        if: steps.torcheck.outputs.tor_up == 'true'
        continue-on-error: true          # מאפשר להמשיך לשלב המייל גם אם נכשל
        run: |
          set -euo pipefail
          URL="https://www.youtube.com/watch?v=I60j6jur_TY"

          # ==== פרמטרים משותפים לכל ניסיון ==== 
          COMMON=(
            --force-ipv4
            --proxy "socks5://127.0.0.1:9050"
            --socket-timeout 10          # ← הפחתתי משמעותית
            --retries 2                  # ← פחות נסיונות, כך שה‑job לא נמשך דקות
            --no-playlist
            -f "ba/b"
            -o "/tmp/video.%(ext)s"
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
            --referer "https://www.youtube.com/"
            --add-header "Accept-Language: en-US,en;q=0.9"
          )
          COOKIE_OPTS=()
          if [[ -n "${{ steps.decode.outputs.cookie_file }}" && -f "${{ steps.decode.outputs.cookie_file }}" ]]; then
            COOKIE_OPTS=(--cookies "${{ steps.decode.outputs.cookie_file }}")
          fi

          # משתמשים ב‑timeout של Bash (30 שניות לכל קריאה ל‑yt‑dlp)
          # כך שהשלב יסתיים גם אם Tor חוסם בקביעות.
          echo "=== Attempt – client=web (Tor) ==="
          timeout 30 bash -c "python3 -m yt_dlp \"\${COMMON[@]}\" \"\${COOKIE_OPTS[@]}\" --extractor-args \"youtube:player_client=web\" \"$URL\"" 2>&1 | tee /tmp/dl.log || true

          # אם עדיין אין קובץ וידאו, מנסים client‑types נוספים
          if ! ls /tmp/video.* 2>/dev/null; then
            for client in ios android tv mweb; do
              echo "=== Attempt – client=$client (Tor) ==="
              timeout 30 bash -c "python3 -m yt_dlp \"\${COMMON[@]}\" \"\${COOKIE_OPTS[@]}\" --extractor-args \"youtube:player_client=$client\" \"$URL\"" 2>&1 | tee -a /tmp/dl.log || true
              if ls /tmp/video.* 2>/dev/null; then break; fi
            done
          fi

          # אם אחרי כל הניסיונות עדיין אין קובץ, מציבים אינדיקטור כ‑fail
          if ls /tmp/video.* 2>/dev/null; then
            echo "DOWNLOAD_SUCCESS=yes" >> $GITHUB_OUTPUT
          else
            echo "DOWNLOAD_SUCCESS=no" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------------------
      # 1️⃣1️⃣ אם Tor לא עובד – נפעל fallback ישיר (קצר)
      # --------------------------------------------------------------
      - name: Fallback direct download (no Tor)
        id: fallback
        if: steps.torcheck.outputs.tor_up != 'true' || steps.dl.outputs.DOWNLOAD_SUCCESS == 'no'
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="https://www.youtube.com/watch?v=I60j6jur_TY"

          COMMON=(
            --force-ipv4
            --socket-timeout 10
            --retries 2
            --no-playlist
            -f "ba/b"
            -o "/tmp/video.%(ext)s"
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
            --referer "https://www.youtube.com/"
            --add-header "Accept-Language: en-US,en;q=0.9"
          )
          COOKIE_OPTS=()
          if [[ -n "${{ steps.decode.outputs.cookie_file }}" && -f "${{ steps.decode.outputs.cookie_file }}" ]]; then
            COOKIE_OPTS=(--cookies "${{ steps.decode.outputs.cookie_file }}")
          fi

          echo "=== Direct fallback – client=web ==="
          timeout 30 bash -c "python3 -m yt_dlp \"\${COMMON[@]}\" \"\${COOKIE_OPTS[@]}\" --extractor-args \"youtube:player_client=web\" \"$URL\"" 2>&1 | tee -a /tmp/dl.log || true

          if ls /tmp/video.* 2>/dev/null; then
            echo "DOWNLOAD_SUCCESS=yes" >> $GITHUB_OUTPUT
          else
            echo "DOWNLOAD_SUCCESS=no" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------------------
      # 12️⃣ Upload artefacts – מאפשר ניתוח אם משהו נתקע
      # --------------------------------------------------------------
      - name: Upload logs as artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-logs
          path: |
            /tmp/install.log
            /tmp/dl.log
            /tmp/yt_cookies.txt
            /tmp/video.*

      # --------------------------------------------------------------
      # 13️⃣ Send e‑mail (תמיד יופעל, גם במקרה של כשלון)
      # --------------------------------------------------------------
      - name: Send e‑mail with logs
        if: always()
        run: |
          python3 <<'EOF'
          import os, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          files = [
            "/tmp/install.log",
            "/tmp/dl.log",
            "/tmp/yt_cookies.txt"
          ]

          body = ""
          for f in files:
            if os.path.exists(f):
              with open(f, "r", errors="replace") as fh:
                body += f"\n\n--- {f} ---\n" + fh.read()
            else:
              body += f"\n\n--- {f} MISSING ---\n"

          msg = MIMEMultipart()
          msg["From"] = os.getenv("EMAIL_FROM")
          msg["To"]   = os.getenv("EMAIL_TO")
          status = os.getenv("DOWNLOAD_SUCCESS", "unknown")
          msg["Subject"] = f"YT‑dlp Tor Debug – {status.upper()}"
          msg.attach(MIMEText(body, "plain"))

          try:
            smtp = smtplib.SMTP("smtp.gmail.com", 587)
            smtp.starttls()
            smtp.login(os.getenv("EMAIL_FROM"), os.getenv("EMAIL_PASSWORD"))
            smtp.send_message(msg)
            smtp.quit()
            print("✅ E‑mail sent")
          except Exception as e:
            print("❌ E‑mail failed:", e)
          EOF
