name: Debug Save Log to Repo

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip3 install --upgrade yt-dlp

      - name: Download and save log
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          yt-dlp --no-playlist -f "bestaudio/best" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1 | tee /tmp/log.txt
          echo "=== SAVING LOG ==="
          cp /tmp/log.txt ${{ github.workspace }}/youtube_log.txt

      - name: Commit log to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add youtube_log.txt
          git commit -m "Add youtube error log" || echo "No changes"
          git push || echo "Push failed"
