name: Debug Simple Status

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pip3 install --upgrade yt-dlp

      - name: Download YouTube
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          
          echo "=== STARTING DOWNLOAD ==="
          
          if yt-dlp --no-playlist -f "bestaudio/best" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY" 2>/tmp/error.txt; then
            echo "STATUS: SUCCESS"
            ls -la /tmp/test/
          else
            echo "STATUS: FAILED"
            echo "=== ERROR LOG ==="
            cat /tmp/error.txt
          fi
