name: Debug with cookies

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: |
          pip3 install --upgrade yt-dlp

      - name: Download with user agent
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          
          yt-dlp \
            --verbose \
            --no-playlist \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -f "bestaudio/best" \
            -o "test.%(ext)s" \
            "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1
          
          echo "=== Done ==="
          ls -la /tmp/test/
