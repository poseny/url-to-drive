name: Debug Minimal

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Just install and test
        run: |
          pip3 install yt-dlp
          yt-dlp --version
          yt-dlp -v "https://www.youtube.com/watch?v=I60j6jur_TY" --print "%(title)s" 2>&1
