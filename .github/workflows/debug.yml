name: Debug No Upload

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install all
        run: |
          echo "=== Installing ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl zip ffmpeg
          pip3 install --upgrade yt-dlp
          curl -s https://rclone.org/install.sh | sudo bash
          echo "=== All installed ==="
          yt-dlp --version
          rclone version

      - name: Download YouTube
        run: |
          echo "=== Downloading ==="
          mkdir -p /tmp/test
          cd /tmp/test
          yt-dlp --no-playlist -f "bestaudio" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1
          echo "=== Download done ==="
          ls -la /tmp/test/

      - name: Create ZIP
        run: |
          echo "=== Creating ZIP ==="
          cd /tmp/test
          zip -j test.zip test.*
          echo "=== ZIP created ==="
          ls -la /tmp/test/
