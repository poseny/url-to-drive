name: Debug Force README

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip3 install --upgrade yt-dlp

      - name: Download and create README
        run: |
          mkdir -p /tmp/test
          cd /tmp/test
          yt-dlp --no-playlist -f "bestaudio/best" -o "test.%(ext)s" "https://www.youtube.com/watch?v=I60j6jur_TY" 2>&1 | tee /tmp/log.txt
          
          echo "=== README CONTENT ===" > README.md
          echo "# YouTube Debug Log" >> README.md
          echo "" >> README.md
          echo "Generated: $(date)" >> README.md
          echo "" >> README.md
          echo '```' >> README.md
          head -200 /tmp/log.txt >> README.md
          echo '```' >> README.md
          
          echo "=== FILE SIZE ==="
          wc -l README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f README.md
          git status
          git commit -m "Force update README" --allow-empty
          git push
