# .github/workflows/download-tor.yml
name: Download YouTube via Tor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL / Playlist / Shorts link"
        required: true
        type: string
      format:
        description: "yt-dlp format selector (default: bestaudio/best)"
        required: false
        default: "ba/b"
        type: string
      client:
        description: "YouTube player client to emulate"
        required: false
        default: "web"
        type: choice
        options: [web, android, ios, tv, mweb, default]

jobs:
  download:
    name: Download via Tor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    env:
      YTDLP_FORMAT: ${{ github.event.inputs.format }}
      YTDLP_CLIENT: ${{ github.event.inputs.client }}
      # Tor proxy + הגנות זמן
      YTDLP_EXTRA_ARGS: "--force-ipv4 --proxy socks5://127.0.0.1:9050 --socket-timeout 30 --retries 3 --fragment-retries 3"

    steps:
      # ---------------------------------------------------------
      # 1. Checkout (רק אם צריך קבצים אחרים מהריפו)
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. הכנת קובץ Cookies מהסוד COOKIE_URLENCODED
      # ---------------------------------------------------------
      - name: Prepare cookies file from secret
        id: cookies
        env:
          COOKIE_URLENCODED: ${{ secrets.COOKIE_URLENCODED }}
        run: |
          set -euo pipefail
          COOKIE_FILE="/tmp/cookies_from_secret.txt"

          if [[ -z "${COOKIE_URLENCODED:-}" ]]; then
            echo "⚠️ Secret COOKIE_URLENCODED is empty or not set – proceeding without cookies."
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # URL-decode: %XX -> char, + -> space
          # משתמשים ב‑python כדי להיות בטוחים בכל התווים
          python3 -c "
import sys, urllib.parse, os
encoded = os.environ['COOKIE_URLENCODED']
decoded = urllib.parse.unquote(encoded)
with open('$COOKIE_FILE', 'w', encoding='utf-8') as f:
    f.write(decoded)
"
          # וידוא פורמט Netscape (לפחות שורה אחת עם טאבים)
          if grep -q $'\t' "$COOKIE_FILE"; then
            echo "✅ Cookies file written to $COOKIE_FILE ($(wc -l < "$COOKIE_FILE") lines)"
            echo "file=$COOKIE_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Decoded content doesn't look like Netscape format (no tabs)."
            echo "   First 200 chars: $(head -c 200 "$COOKIE_FILE")"
            echo "   Proceeding anyway – yt-dlp will fail if format is wrong."
            echo "file=$COOKIE_FILE" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------
      # 3. התקנת תלויות + Tor
      # ---------------------------------------------------------
      - name: Install system deps (tor, python3, pip, nodejs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor python3 python3-pip nodejs > /tmp/apt_install.log 2>&1
          echo "APT exit: $?"

      - name: Start & verify Tor
        run: |
          sudo service tor start
          sleep 5

          echo "--- Tor connectivity test ---"
          curl --socks5-hostname 127.0.0.1:9050 -s https://check.torproject.org/api/ip \
            | jq -r '.IP // "unknown"' | tee /tmp/tor_ip.txt
          echo "Tor exit IP: $(cat /tmp/tor_ip.txt)"

          GH_IP=$(curl -s https://api.ipify.org)
          echo "GitHub runner IP: $GH_IP"
          if [[ "$(cat /tmp/tor_ip.txt)" == "$GH_IP" ]]; then
            echo "⚠️ WARNING: Tor IP equals GitHub IP – Tor may not be routing!"
          else
            echo "✅ Tor is routing traffic through a different IP."
          fi

      - name: Install / upgrade yt-dlp (+ yt-dlp-ejs)
        run: |
          python3 -m pip install --user --upgrade --no-cache-dir "yt-dlp[default]" yt-dlp-ejs 2>&1 | tee /tmp/pip_install.log
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # 4. הורדה בפועל
      # ---------------------------------------------------------
      - name: Download with yt-dlp over Tor
        id: dl
        env:
          COOKIE_FILE: ${{ steps.cookies.outputs.file }}
          URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          ARGS=(
            --no-playlist
            -f "${YTDLP_FORMAT}"
            -o "/tmp/%(title)s [%(id)s].%(ext)s"
            --extractor-args "youtube:player_client=${YTDLP_CLIENT}"
            ${YTDLP_EXTRA_ARGS}
          )

          if [[ -n "$COOKIE_FILE" && -f "$COOKIE_FILE" ]]; then
            ARGS+=(--cookies "$COOKIE_FILE")
            echo "Using cookies from secret: $COOKIE_FILE"
          else
            echo "No cookies file – proceeding anonymously."
          fi

          echo "Running: yt-dlp ${ARGS[@]} \"$URL\""
          python3 -m yt_dlp "${ARGS[@]}" "$URL" 2>&1 | tee /tmp/yt_dlp.log
          DL_EXIT=${PIPESTATUS[0]}

          # חילוץ הנתיב של הקובץ שירד
          DOWNLOADED_FILE=$(grep -E '^\[download\] Destination:|^\[Merger\] Merging into ' /tmp/yt_dlp.log | tail -1 | sed -E 's/.*: //; s/^\[Merger\] Merging into //')
          if [[ -z "$DOWNLOADED_FILE" ]]; then
            DOWNLOADED_FILE=$(find /tmp -maxdepth 1 -type f -newer /tmp/yt_dlp.log ! -name "*.log" ! -name "*.txt" | head -1)
          fi

          echo "exit_code=$DL_EXIT" >> "$GITHUB_OUTPUT"
          echo "file_path=$DOWNLOADED_FILE" >> "$GITHUB_OUTPUT"
          echo "log_path=/tmp/yt_dlp.log" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 5. העלאת הקובץ כ‑Artifact
      # ---------------------------------------------------------
      - name: Upload downloaded file
        if: steps.dl.outputs.exit_code == '0' && steps.dl.outputs.file_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtube-download-${{ github.run_id }}
          path: ${{ steps.dl.outputs.file_path }}
          retention-days: 90

      # ---------------------------------------------------------
      # 6. שליחת לוג במייל (אופציונלי)
      # ---------------------------------------------------------
      - name: Email log on failure (or always)
        if: always() && env.EMAIL_PASSWORD != ''
        env:
          EMAIL_FROM: p0556722432@gmail.com
          EMAIL_TO: p0556722432@gmail.com
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import smtplib, os, sys
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          log_path = "${{ steps.dl.outputs.log_path }}"
          exit_code = "${{ steps.dl.outputs.exit_code }}"
          file_path = "${{ steps.dl.outputs.file_path }}"

          body = f"YouTube Tor Download — Exit code: {exit_code}\n"
          body += f"File: {file_path or 'N/A'}\n\n"

          if os.path.exists(log_path):
              with open(log_path, "r", errors="replace") as f:
                  body += f.read()
          else:
              body += "Log file not found."

          msg = MIMEMultipart()
          msg["From"] = os.environ["EMAIL_FROM"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg["Subject"] = f"[GitHub Actions] yt-dlp Tor — {'OK' if exit_code == '0' else 'FAILED'}"
          msg.attach(MIMEText(body, "plain"))

          try:
              with smtplib.SMTP("smtp.gmail.com", 587) as s:
                  s.starttls()
                  s.login(os.environ["EMAIL_FROM"], os.environ["EMAIL_PASSWORD"])
                  s.send_message(msg)
              print("Email sent.")
          except Exception as e:
              print(f"Email failed: {e}", file=sys.stderr)
          PYEOF
