name: Upload URL → Google Drive (ZIP – custom inner name)

# הפעלה ידנית עם ארבעה קלטים
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת ה‑URL של הקובץ להורדה"
        required: true
        default: "https://ahblicklive.com/new_ded_video/26/23/VnOMPDVrju0PTSBRnvz/NNHEEG/480.mp4"
      folder:
        description: "שם תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ ZIP (ללא סיומת). אם ריק – ייקח את שם הקובץ מה‑URL."
        required: false
        default: ""
      inner_name:
        description: "שם הקובץ הפנימי בארכיון (כולל סיומת). אם ריק – ישתמש בשם הקובץ מה‑URL."
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (zip כבר מותקן ב‑Ubuntu)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  קביעת שמות (ZIP, שם פנימי, נתיב דרייב)
      # --------------------------------------------------------------
      - name: Determine final names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_ZIPNAME: ${{ github.event.inputs.filename }}
          USER_INNERNAME: ${{ github.event.inputs.inner_name }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ---- 3.1 – שם הקובץ שמופיע ב‑URL (למשל 480.mp4) ----
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                     # מסיר query‑string אם קיים
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # ---- 3.2 – שם קובץ ה‑ZIP עצמו (ב‑Drive) ----
          if [[ -n "$USER_ZIPNAME" ]]; then
            zip_base="$USER_ZIPNAME"
          else
            zip_base="${decoded_name%.*}"   # ללא סיומת
          fi
          zip_name="${zip_base}.zip"
          echo "📦 ZIP file name on Drive = $zip_name"

          # ---- 3.3 – שם פנימי בתוך ה‑ZIP ----------
          if [[ -n "$USER_INNERNAME" ]]; then
            internal_name="$USER_INNERNAME"
          else
            internal_name="$decoded_name"
          fi
          echo "📁 Internal file name inside ZIP = $internal_name"

          # ---- 3.4 – נתיב מלא ב
