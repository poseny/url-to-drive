name: Upload URL → Google Drive (ZIP, keep original name)

# הפעלה ידנית דרך ממשק GitHub
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת ה‑URL של הקובץ להורדה"
        required: true
        default: "https://ahblicklive.com/new_ded_video/26/23/VnOMPDVrju0PTSBRnvz/NNHEEG/480.mp4"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      # אם תרצה לשנות את שם הקובץ לפני ה‑ZIP (ללא סיומת)
      filename:
        description: "שם קובץ ייעודי (ללא סיומת). אם ריק – נלקח מה‑URL"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣ התקנת rclone
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣ קונפיג rclone – remote בשם gdrive
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣ חישוב שמות הקבצים (ZIP + קובץ פנימי)
      # --------------------------------------------------------------
      - name: Determine final names
        id: name_builder
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          FOLDER: ${{ github.event.inputs.folder }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          # ---- שם הקובץ מה‑URL (לדוגמה 480.mp4) ----
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                     # הורד query‑string אם קיים
          # decode %XX (לדוגמה %D7%AA)
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # אם המשתמש סיפק שם קובץ (בלי סיומת) – נשתמש בו,
          # אחרת נשתמש בשם מה‑URL ללא הסיומת
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"   # מסיר סיומת אם יש (480)
          fi

          # שם הקובץ שבתוך ה‑ZIP – חייב להיות עם סיומת מקורית
          internal_name="$decoded_name"

          # שם קובץ ה‑ZIP עצמו (base_name + .zip)
          zip_name="${base_name}.zip"

          # נתיב מלא ב‑Drive (folder/zip_name)
          remote_path="gdrive:${FOLDER}/${zip_name}"

          echo "📦 ZIP name that will be stored in Drive = $zip_name"
          echo "📁 Internal name inside ZIP               = $internal_name"
          echo "🛣️ Remote path = $remote_path"

          # שמירת ערכים לשימוש בשלבים הבאים
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣ (אופציונלי) מחיקת קובץ ZIP קיים באותו שם
      # --------------------------------------------------------------
      - name: Delete previous ZIP if it exists
        env:
          REMOTE_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file to delete"
          fi

      # --------------------------------------------------------------
      # 5️⃣ הורדה → יצירת ZIP (Python) → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Download → zip (preserving inner name) → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.name_builder.outputs.internal_name }}
          DEST_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          set -e

          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"

          # 1️⃣ הורדת הקובץ מה‑URL (קודם ל‑stdout)
          # 2️⃣ קוד Python יוצר ZIP ב‑memory,
          #    מקצים לשורה $INTERNAL_NAME כ‑שם קובץ פנימי,
          #    ומוציא את ה‑ZIP ל‑stdout.
          # 3️⃣ rclone rcat קורא את ה‑ZIP מ‑stdout ומעלה אותו ל‑Drive.
          wget -q -O - "$FILE_URL" |
          python3 - <<PY
import sys, zipfile, io

# קריאת כל הנתונים מה‑stdin (הקובץ שנשאל)
data = sys.stdin.buffer.read()

# שם הקובץ הפנימי באטמון (מתקבל מה‑environment)
internal_name = "${INTERNAL_NAME}"

# יצירת קובץ ZIP במקום בזיכרון (BytesIO)
zip_buffer = io.BytesIO()
with zipfile.ZipFile(zip_buffer, mode="w", compression=zipfile.ZIP_DEFLATED) as zf:
    # ה‑write של הנתונים תחת שם הקובץ המבוקש
    zf.writestr(internal_name, data)

# שליחת ה‑ZIP אל stdout (ה‑pipeline הבא)
sys.stdout.buffer.write(zip_buffer.getvalue())
PY
          | rclone rcat "$DEST_PATH" --progress
