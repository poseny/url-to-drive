name: Upload URL → Google Drive (ZIP, keep original name)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL של הקובץ להורדה"
        required: true
        default: "https://ahblicklive.com/new_ded_video/26/23/VnOMPDVrju0PTSBRnvz/NNHEEG/480.mp4"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ מותאם (ללא סיומת, אם ריק – ייקח מה‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (zip כבר מותקן במערכת)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  בניית שמות קבצים (ZIP + שם פנימי)
      # --------------------------------------------------------------
      - name: Determine filenames
        id: name_builder
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ---------- 3.1 – שם קובץ מה‑URL ----------
          raw_name=$(basename "$FILE_URL")               # לדוגמה 480.mp4
          raw_name=${raw_name%%\?*}                      # מסיר query string אם יש
          # פיענוח %XX -> תו אמיתי (חשוב כשיש אותיות עבריות)
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # ---------- 3.2 – בחירת בסיס שם ----------
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            # מסיר סיומת קיימת כדי שלא נקבל שם כפול (480.mp4 → 480)
            base_name="${decoded_name%.*}"
          fi

          # שם הקובץ הפנימי ב‑ZIP – צריך לכלול סיומת מקורית
          internal_name="$decoded_name"

          # שם קובץ ה‑ZIP עצמו (base_name + .zip)
          zip_name="${base_name}.zip"

          echo "📦 ZIP file that will be stored in Drive = $zip_name"
          echo "🗂️ Internal file name inside ZIP            = $internal_name"

          # נתיב מרוחק ב‑Drive (folder/zip_name)
          remote_path="gdrive:${FOLDER}/${zip_name}"

          # שמירת ערכים לשימוש בשלבים הבאים
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  (אופציונלי) מחיקת קובץ ZIP קיים באותו שם
      # --------------------------------------------------------------
      - name: Delete previous ZIP if it exists
        env:
          REMOTE_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file to delete"
          fi

      # --------------------------------------------------------------
      # 5️⃣  זרימת ההורדה → ZIP (עם שם פנימי) → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Transfer (download → zip with correct inner name → upload)
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.name_builder.outputs.internal_name }}
          DEST_PATH: ${{ steps.name_builder.outputs.remote_path }}
        run: |
          set -e
          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"

          # **הקפדה על סדר הארגומנטים**
          #   zip -q - "<internal‑name>" - 
          #   ^       ^   ^               ^
          #   |       |   |               |
          #   |       |   └─ קריאת קובץ מ‑stdin (ה‑stream של wget)
          #   |       └─ שם הקובץ הפנימי ב‑ZIP
          #   └─ פלט ZIP ל‑STDOUT (ה‑pipe שמגיע ל‑rclone)
          wget -q -O - "$FILE_URL" \
            | zip -q - "${INTERNAL_NAME}" - \
            | rclone rcat "$DEST_PATH" --progress
