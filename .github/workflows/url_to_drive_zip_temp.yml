name: Upload URL → Google Drive (real ZIP – temp‑file method)

# הרצה ידנית
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ להורדה"
        required: true
        default: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Her_First_Kiss_%281919%29.webm"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ ZIP לפני .zip (אם ריק – נלקח מה‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # 1️⃣  התקנת rclone (zip כבר קיים במערכת)
      # ------------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # ------------------------------------------------------------------
      # 2️⃣  קונפיג של rclone – remote בשם gdrive
      # ------------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # ------------------------------------------------------------------
      # 3️⃣  חישוב שמות – zip_name (ב‑Drive) + internal_name (ב‑ZIP)
      # ------------------------------------------------------------------
      - name: Determine names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # 3.1 – שם הקובץ כפי שמופיע ב‑URL
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                     # חותך query‑string אם קיים
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # 3.2 – בסיס שם קובץ ה‑ZIP (אם USER_NAME ריק – נשתמש בשם ללא סיומת)
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"               # מוחק סיומת קיימת (mp4, webm …)
          fi

          zip_name="${base_name}.zip"                     # שם ZIP שייראה ב‑Drive
          internal_name="$decoded_name"                   # שם הקובץ הפנימי ב‑ZIP

          echo "📦 ZIP file on Drive      = $zip_name"
          echo "📁 Internal name in ZIP   = $internal_name"

          remote_path="gdrive:${FOLDER}/${zip_name}"
          echo "zip_name=$zip_name"        >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path"  >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 4️⃣  מחיקת קובץ קיים באותו שם (אופציונלי)
      # ------------------------------------------------------------------
      - name: Delete previous ZIP (if any)
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file found"
          fi

      # ------------------------------------------------------------------
      # 5️⃣  שלב ההורדה, שינוי שם מקומי, יצירת ZIP, העלאה ל‑Drive
      # ------------------------------------------------------------------
      - name: Download → rename → zip → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.names.outputs.internal_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          set -e
          set -o pipefail               # אם שלב נכשל – ה‑job נכשל מיד

          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"

          # -------------- קבצים זמניים --------------
          TMP_DOWNLOAD=$(mktemp /tmp/source.XXXXXX)   # הקובץ המקורי מה‑URL
          TMP_RENAMED=$(mktemp /tmp/renamed.XXXXXX)   # שם קובץ זמני עם שם פנימי רצוי
          TMP_ZIP=$(mktemp /tmp/archive.XXXXXX.zip)   # קובץ ZIP הסופי

          # נוודא ניקוי קבצים גם אם ה‑job נכשל
          cleanup() {
            rm -f "$TMP_DOWNLOAD" "$TMP_RENAMED" "$TMP_ZIP"
          }
          trap cleanup EXIT

          # 1️⃣ הורדה
          echo "🔽 Downloading $FILE_URL → $TMP_DOWNLOAD"
          wget -q -O "$TMP_DOWNLOAD" "$FILE_URL"

          # 2️⃣ שינוי שם מקומי (זה מה שקובע כיצד הקובץ יופיע בתוך ה‑ZIP)
          echo "🔀 Renaming to internal name \"$INTERNAL_NAME\""
          # יש להימנע משימוש ב‑mv עם שם שכולל PATH – נשתמש רק בקובץ פשוט
          cp "$TMP_DOWNLOAD" "$TMP_RENAMED"
          mv "$TMP_RENAMED" "$(dirname "$TMP_RENAMED")/$INTERNAL_NAME"

          # 3️⃣ יצירת ZIP – -j מוודא שה‑ZIP מכיל רק את שם הקובץ (ללא נתיב)
          echo "🗜️ Creating ZIP $TMP_ZIP"
          zip -j -q "$TMP_ZIP" "$(dirname "$TMP_RENAMED")/$INTERNAL_NAME"

          # 4️⃣ העלאה ל‑Google Drive (copyto מגדיר שם קובץ מדויק)
          echo "📤 Uploading ZIP to Drive"
          rclone copyto "$TMP_ZIP" "$DEST_PATH" --progress

          echo "✅ Finished – $DEST_PATH is now on Google Drive"
