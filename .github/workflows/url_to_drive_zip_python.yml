name: Upload URL → Google Drive (ZIP built with Python)

# מאפשר שליחה ידנית של קובץ כל‑גודל ובשם מבוקש
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ להורדה"
        required: true
        default: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Her_First_Kiss_%281919%29.webm"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – נלקח מה‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (zip ו‑Python כבר מותקנים)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  חישוב שמות הקבצים
      #   – zip_name  : שם קובץ ה‑ZIP שיישמר ב‑Drive
      #   – internal_name : שם הקובץ הפנימי (הקובץ המקורי)
      # --------------------------------------------------------------
      - name: Determine file names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ----- שם הקובץ מה‑URL (לדוגמה 480.mp4) -----
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                       # הורד query‑string אם קיים
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # ----- שם בסיס עבור קובץ ה‑ZIP -----------------
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"                # חותך סיומת אם קיימת
          fi

          zip_name="${base_name}.zip"                     # שם קובץ ה‑ZIP ב‑Drive
          internal_name="$decoded_name"                   # שם הקובץ הפנימי ב‑ZIP

          echo "📦 ZIP name on Drive      = $zip_name"
          echo "📁 Internal name in ZIP   = $internal_name"

          remote_path="gdrive:${FOLDER}/${zip_name}"
          echo "zip_name=$zip_name"          >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path"    >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  (אופציונלי) מחיקת קובץ קיים באותו שם
      # --------------------------------------------------------------
      - name: Delete previous ZIP (if any)
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה → יצירת ZIP ב‑Python (ב‑memory) → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Download → Python zip (stream) → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.names.outputs.internal_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          set -e
          set -o pipefail          # אם שלב אחד נכשל – נצא ונדווח כ‑failure

          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"

          # --------------------------------------------------------------
          #   Python‑one‑liner שמייצר ZIP ב‑memory
          # --------------------------------------------------------------
          wget -q -O - "$FILE_URL" \
            | python3 - <<'PY'
import os
import sys
import io
import zipfile

# שם הקובץ הפנימי נלקח מה‑Environment Variable שה‑GitHub Action שלף
internal_name = os.getenv('INTERNAL_NAME')
if not internal_name:
    sys.exit('INTERNAL_NAME env var not set')

# קריאת כל הקובץ מה‑stdin (זהו ה‑stream של wget)
data = sys.stdin.buffer.read()

# בנייה של קובץ ZIP במשתנה BytesIO (זיכרון בלבד)
buf = io.BytesIO()
with zipfile.ZipFile(buf, mode='w', compression=zipfile.ZIP_DEFLATED) as zf:
    # ה‑ZipInfo מאפשר להגדיר תאריך/זמן קבוע (לא מחייב) – כאן נשתמש ב‑default
    zf.writestr(internal_name, data)

# כתיבה של קובץ ה‑ZIP ל‑stdout (רק הבייטים של ה‑archive)
sys.stdout.buffer.write(buf.getvalue())
PY
            # קביעת שם קובץ ה‑ZIP ב‑Google Drive על‑ידי rclone
            | rclone rcat "$DEST_PATH" --progress
