name: Upload URL → Google Drive (tar‑gzip served as .zip)

# מאפשר שליחת קובץ כל גודל ובכל שם
on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ להורדה"
        required: true
        default: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Her_First_Kiss_%281919%29.webm"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – נלקח מה‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (tar & gzip כבר קיימים ב‑Ubuntu)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  כתיבת קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  קביעת שם הקובץ – zip_name (ב‑Drive) ו‑internal_name (בתוך ה‑archive)
      # --------------------------------------------------------------
      - name: Determine names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ---- 3.1 – שם הקובץ מה‑URL (לדוגמה 480.mp4) -----
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                     # חותך ?query אם קיים
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # ---- 3.2 – שם בסיס עבור קובץ ה‑ZIP ----------
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"               # מסיר סיומת (אם יש)
          fi

          zip_name="${base_name}.zip"                     # שם הקובץ שיופיע ב‑Drive
          internal_name="$decoded_name"                   # שם הקובץ הפנימי ב‑archive

          echo "📦 ZIP name on Drive      = $zip_name"
          echo "📁 Internal name in ZIP  = $internal_name"

          remote_path="gdrive:${FOLDER}/${zip_name}"
          echo "zip_name=$zip_name"        >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path"  >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣  (אופציונלי) מחיקת קובץ קיים באותו שם לפני העלאה
      # --------------------------------------------------------------
      - name: Delete previous ZIP (if any)
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה → tar‑gzip (preserve original name) → העלאה ל‑Drive
      # --------------------------------------------------------------
      - name: Download → tar‑gzip → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.names.outputs.internal_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          set -e
          set -o pipefail   # אם אחד הצינורות נכשל הריצה תפסיק

          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"

          # -----------------------------------------------------------
          #  איך זה עובד?
          #   wget  →   מוריד את הקובץ raw ל‑stdout
          #   tar   →   יוצר ארכיון tar שמכיל קובץ אחד (ה‑INTERNAL_NAME) ומעביר
          #              את ה‑archive ל‑gzip (שומר על הדחיסה)
          #   rclone rcat → קורא את זרם ה‑gzip (שהוא בעצם .tgz) ושולח אותו
          #                 ישירות ל‑Google Drive בשם <base>.zip
          # -----------------------------------------------------------
          wget -q -O - "$FILE_URL" \
            | tar -czf - - --transform="s|^|$INTERNAL_NAME|s|$|$INTERNAL_NAME|" - \
            | rclone rcat "$DEST_PATH" --progress
