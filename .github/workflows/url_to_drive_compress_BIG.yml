name: Upload URL → Google Drive (ZIP – works for any size)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ להורדה"
        required: true
        default: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Her_First_Kiss_%281919%29.webm"
      folder:
        description: "תיקיית יעד ב‑Drive"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – נלקח מה‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣ התקנת rclone (zip כבר קיים במערכת)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣ קונפיג של rclone
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣ בניית שמות – שם ZIP בשם משתמש, שם פנימי עם שם המקורי
      # --------------------------------------------------------------
      - name: Determine file names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # ----- 3.1 – שם הקובץ שמופיע ב‑URL (לדוגמה 480.mp4) -----
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}                         # חתך query‑string
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          # ----- 3.2 – שם בסיס לתיקייה של ZIP ------------------
          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"                # מסיר סיומת אם יש
          fi

          zip_name="${base_name}.zip"                      # שם קובץ ה‑ZIP ב‑Drive
          internal_name="$decoded_name"                    # שם קובץ פנימי ב‑ZIP

          echo "📦 ZIP file on Drive      = $zip_name"
          echo "📁 Internal name in ZIP   = $internal_name"

          remote_path="gdrive:${FOLDER}/${zip_name}"
          echo "zip_name=$zip_name"          >> $GITHUB_OUTPUT
          echo "internal_name=$internal_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path"    >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 4️⃣ מחיקת קובץ קיים באותו שם (אם קיים)
      # --------------------------------------------------------------
      - name: Delete previous ZIP (if any)
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous file to delete"
          fi

      # --------------------------------------------------------------
      # 5️⃣ Download → zip (preserve internal name) → upload
      # --------------------------------------------------------------
      - name: Download → zip (preserve internal name) → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          INTERNAL_NAME: ${{ steps.names.outputs.internal_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          set -e
          set -o pipefail     # אם אחד הצינורות נכשל – נסגרים

          echo "🚀 Starting transfer"
          echo "URL            = $FILE_URL"
          echo "Internal name  = $INTERNAL_NAME"
          echo "Destination    = $DEST_PATH"

          # ========= משמעות הפקודה =========
          #   wget …                      → קורא את הקובץ מה‑URL.
          #   zip -q - "-:${INTERNAL_NAME}" -   → 
          #        •  zip‑file   = -      (stdout → pipe)
          #        •  entry‑name = ${INTERNAL_NAME}   (ה‑-: מציין שם קובץ פנימי)
          #        •  מקור       = -      (קורא את המידע מ‑stdin)
          #   rclone rcat …               → מזרים את ה‑ZIP ל‑Google Drive.
          #
          # חשוב: שם הקובץ הפנימי מועבר ב‑ציטוטים כפולים כדי
          #        לשמור על רווחים, סוגריים ו‑Unicode.
          wget -q -O - "$FILE_URL" \
            | zip -q - "-:${INTERNAL_NAME}" - \
            | rclone rcat "$DEST_PATH" --progress
