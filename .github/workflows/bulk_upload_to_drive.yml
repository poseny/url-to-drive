name: Bulk upload URLs → Google Drive (one ZIP per URL)

# אפשר להפעיל ידנית או באופן אוטומטי כשהקובץ urls.txt מתעדכן
on:
  workflow_dispatch:                     # הרצה ידנית
  push:
    paths:
      - 'bulk/urls.txt'                  # שינוי בקובץ → ריצה אוטומטית

jobs:
  bulk-upload:
    runs-on: ubuntu-latest
    env:
      # תיקיית ה‑Drive שאליה יועלו הקבצים (אפשר לשנות מה‑UI גם)
      DEST_FOLDER: MyUploads
    steps:
      # --------------------------------------------------------------
      # 0️⃣  התקנת rclone (zip, curl, mktemp כבר במערכת)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 1️⃣  קובץ קונפיג ל‑rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 2️⃣  משיכת הקוד (כולל bulk/urls.txt)
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4   # מושך את כל המאגר – קובץ urls.txt יהיה כאן

      # --------------------------------------------------------------
      # 3️⃣  לולאה על כל השורות של bulk/urls.txt
      # --------------------------------------------------------------
      - name: Process every URL and upload as ZIP
        env:
          DEST_FOLDER: ${{ env.DEST_FOLDER }}
        run: |
          set -e
          set -o pipefail

          INPUT_FILE="bulk/urls.txt"

          if [[ ! -f "$INPUT_FILE" ]]; then
            echo "❌ קובץ הקלט $INPUT_FILE אינו קיים"
            exit 1
          fi

          # פונקציה שמטפלת ב‑URL אחד
          process_one() {
            local url="$1"
            local custom_name="$2"

            # ---------- 1️⃣ שם הקובץ מה‑URL ----------
            raw_name=$(basename "$url")
            raw_name=${raw_name%%\?*}                     # חותך ?query אם קיים
            decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
            echo "🔤 Decoded name from URL = $decoded_name"

            # ---------- 2️⃣ basename של קובץ ה‑ZIP ----------
            if [[ -n "$custom_name" ]]; then
              base_name="$custom_name"
            else
              base_name="${decoded_name%.*}"               # מסיר סיומת (אם יש)
            fi
            zip_name="${base_name}.zip"
            internal_name="$decoded_name"

            echo "📦 ZIP name that will be created = $zip_name"
            echo "📁 Internally stored file name  = $internal_name"

            # ---------- 3️⃣ work‑dir זמני ----------
            work_dir=$(mktemp -d)
            src_file="${work_dir}/downloaded"
            zip_file="${work_dir}/${zip_name}"

            # ---------- 4️⃣ הורדה ----------
            echo "⬇️ Downloading $url → $src_file"
            curl -L -s -o "$src_file" "$url"
            if [[ ! -s "$src_file" ]]; then
              echo "❌ הורדה נכשלה או שהקובץ ריק – $url"
              exit 1
            fi

            # ---------- 5️⃣ יצירת ZIP ----------
            cp "$src_file" "${work_dir}/${internal_name}"
            (cd "$work_dir" && zip -j -q "$zip_file" "$internal_name")
            if [[ ! -s "$zip_file" ]]; then
              echo "❌ יצירת ZIP נכשלה – $zip_name"
              exit 1
            fi

            # ---------- 6️⃣ העלאה ל‑Drive ----------
            remote_path="gdrive:${DEST_FOLDER}/${zip_name}"
            echo "🚀 Uploading $zip_name → $remote_path"
            rclone copy "$zip_file" "$remote_path" --progress

            # ניקוי זמני
            rm -rf "$work_dir"
          }

          # -------------------------------------------------
          # קריאה לפונקציה על‑פי כל שורה בקובץ
          # -------------------------------------------------
          line_no=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            ((line_no++))
            # דלג על ריק או על שורות שמתחילות ב‑#
            [[ -z "$line" || "$line" =~ ^# ]] && continue

            # פצל ל‑URL ו‑optional‑basename
            IFS='|' read -r url opt_name <<< "$line"
            url=$(echo "$url" | xargs)          # trim spaces
            opt_name=$(echo "$opt_name" | xargs)   # יכול לשאר ריק

            echo "=== מעבד שורה #$line_no ==="
            process_one "$url" "$opt_name"
          done < "$INPUT_FILE"

          echo "✅ כל הקבצים הועלו בהצלחה!"
