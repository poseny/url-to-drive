name: Upload Multiple URLs → Google Drive (ZIP loop)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: |
          רשימת קישורים – שורה אחת לכל קישור.
          (דוגמה בתיעוד של הקלט)
        required: true
        default: |
          https://ahblicklive.com/new_ded_video/26/23/VnOMPDVrju0PTSBRnvz/NNHEEG/480.mp4
          https://upload.wikimedia.org/wikipedia/commons/d/d6/Her_First_Kiss_%281919%29.webm
      folder:
        description: "תיקיית יעד ב‑Drive"
        required: true
        default: "MyUploads"
      filename_prefix:
        description: |
          קידומת לשמות קובצי ZIP (ריק = שימוש בשם המקור). 
          אם תזין “BatchA” ויהיו 3 קישורים, תתקבלנה:
            BatchA_1.zip, BatchA_2.zip, BatchA_3.zip
        required: false
        default: ""

jobs:
  upload-multiple:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone (zip וכד’ כבר קיימים במערכת Ubuntu)
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  כתיבת קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  לולאה על כל הקישורים
      # --------------------------------------------------------------
      - name: Process all URLs
        env:
          URLS: ${{ github.event.inputs.urls }}
          FOLDER: ${{ github.event.inputs.folder }}
          PREFIX: ${{ github.event.inputs.filename_prefix }}
        run: |
          set -e
          set -o pipefail

          # נוודא שיש קו חדש אחרי כל שורה (ה‑default של GitHub לעיתים משאיר רווח בקצה)
          URLS=$(printf "%s\n" "$URLS")

          COUNTER=0   # משמש למספר קידומת אם בקשת PREFIX
          while IFS= read -r FILE_URL; do
            # דלג על שורות ריקות (אם היו)
            [[ -z "$FILE_URL" ]] && continue
            ((COUNTER++))

            echo "=============================="
            echo "🔗 Processing #${COUNTER}: $FILE_URL"

            # ---- שלב 1 – חישוב שם קובץ מקורי מה‑URL ----------
            raw_name=$(basename "$FILE_URL")
            raw_name=${raw_name%%\?*}                     # חותך query‑string אם קיים
            decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
            echo "🔤 Decoded name from URL = $decoded_name"

            # ---- שלב 2 – בחירת שם קובץ ZIP --------------------
            if [[ -n "$PREFIX" ]]; then
              zip_name="${PREFIX}_${COUNTER}.zip"
            else
              # מייצרים שם ZIP מה‑basename של הקובץ המקורי, ללא סיומת
              base_without_ext="${decoded_name%.*}"
              zip_name="${base_without_ext}.zip"
            fi

            echo "📦 ZIP name that will be stored on Drive = $zip_name"

            # ---- שלב 3 – נתיב יעד ב‑Drive --------------------
            remote_path="gdrive:${FOLDER}/${zip_name}"
            echo "🗂️ Remote path = $remote_path"

            # -------------------------------------------------
            # 3️⃣   הורדה → zip (עם שם פנימי) → העלאה
            # -------------------------------------------------
            #   - `zip -q - -:"$decoded_name" -` :
            #        * יוצר ZIP שמיכתוב ל‑stdout,
            #        * שם קובץ הפנימי הוא $decoded_name,
            #        * הקובץ עצמו נקרא מ‑stdin (ה‑wget).
            #   - `rclone rcat` מעלה ישירות ל‑Drive.
            # -------------------------------------------------
            wget -q -O - "$FILE_URL" \
              | zip -q - -:"$decoded_name" - \
              | rclone rcat "$remote_path" --progress

            echo "✅ Finished #${COUNTER} – $zip_name uploaded"
          done <<< "$URLS"

          echo "🎉 All URLs processed successfully"
