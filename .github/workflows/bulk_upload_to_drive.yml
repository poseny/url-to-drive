name: Upload URL → Google Drive (Zip via temporary file)

# מאפשר הרצה ידנית
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL אחד, או רשימת URLs באותה שורה מופרדת בפסיקים"
        required: true
        default: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Her_First_Kiss_%281919%29.webm"

      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"

      filename:
        description: "שם קובץ לפני .zip (אם ריק – ייקח משם הקובץ ב‑URL)"
        required: false
        default: ""

      parallel_jobs:
        description: "כמה URLs להוריד/להעלות במקביל"
        required: false
        default: "3"

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת rclone
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣  קונפיג של rclone
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣  חישוב שמות לכל URL ברשימה
      # --------------------------------------------------------------
      - name: Determine file names
        id: names
        env:
          URL_INPUT: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          MANIFEST_FILE=$(mktemp)
          count=0

          # פיצול רשימת URLs לפי פסיקים
          IFS=',' read -r -a URL_ARRAY <<< "$URL_INPUT"

          for raw_url in "${URL_ARRAY[@]}"; do
            FILE_URL="$(printf '%s' "$raw_url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            [[ -z "$FILE_URL" ]] && continue

            # ----- שם הקובץ מ‑URL -----
            raw_name=$(basename "$FILE_URL")
            raw_name=${raw_name%%\?*}

            # decode %XX
            decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")

            # ----- שם קובץ ZIP -----
            if [[ -n "$USER_NAME" ]]; then
              base_name="$USER_NAME"
            else
              base_name="${decoded_name%.*}"
            fi

            zip_name="${base_name}.zip"
            original_name="$decoded_name"
            remote_path="gdrive:${FOLDER}/$zip_name"

            printf '%s\t%s\t%s\t%s\t%s\n' "$FILE_URL" "$FOLDER" "$zip_name" "$original_name" "$remote_path" >> "$MANIFEST_FILE"

            count=$((count + 1))
          done

          if [[ "$count" -eq 0 ]]; then
            echo "❌ No URLs found"
            exit 1
          fi

          echo "📦 Found $count URL(s)"
          cat "$MANIFEST_FILE"

          echo "manifest_file=$MANIFEST_FILE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------
      # 4️⃣  מחיקת קבצים קיימים באותו שם ב‑Drive
      # --------------------------------------------------------------
      - name: Delete old ZIP(s) if they exist
        env:
          MANIFEST_FILE: ${{ steps.names.outputs.manifest_file }}
        run: |
          set -e

          while IFS=$'\t' read -r FILE_URL FOLDER ZIP_NAME ORIGINAL_NAME REMOTE_PATH; do
            if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
              echo "🗑️ Deleting previous $REMOTE_PATH"
              rclone delete "$REMOTE_PATH"
            else
              echo "✅ No previous ZIP found: $REMOTE_PATH"
            fi
          done < "$MANIFEST_FILE"

      # --------------------------------------------------------------
      # 5️⃣  הורדה → ZIP → העלאה ל‑Drive במקביל
      # --------------------------------------------------------------
      - name: Download → zip → upload
        env:
          MANIFEST_FILE: ${{ steps.names.outputs.manifest_file }}
          PARALLEL_JOBS: ${{ github.event.inputs.parallel_jobs }}
        run: |
          set -e
          set -o pipefail

          if [[ -z "$PARALLEL_JOBS" || ! "$PARALLEL_JOBS" =~ ^[0-9]+$ || "$PARALLEL_JOBS" -lt 1 ]]; then
            PARALLEL_JOBS=3
          fi

          upload_one() {
            local line="$1"
            local FILE_URL FOLDER ZIP_NAME ORIGINAL_NAME DEST_PATH

            IFS=$'\t' read -r FILE_URL FOLDER ZIP_NAME ORIGINAL_NAME DEST_PATH <<< "$line"

            TMP_DIR=$(mktemp -d)
            TMP_FILE="${TMP_DIR}/downloaded_file"
            TMP_ZIP="${TMP_DIR}/${ZIP_NAME}"

            echo "📂 Working directory = $TMP_DIR"

            # 1️⃣ הורדה
            echo "⬇️ Downloading $FILE_URL → $TMP_FILE"
            if ! curl -L -s -o "$TMP_FILE" "$FILE_URL"; then
              echo "❌ Download failed: $FILE_URL"
              rm -rf "$TMP_DIR"
              return 1
            fi

            if [[ ! -s "$TMP_FILE" ]]; then
              echo "❌ Download failed or file is empty: $FILE_URL"
              rm -rf "$TMP_DIR"
              return 1
            fi

            # 2️⃣ יצירת ZIP
            echo "🗜️ Creating ZIP $TMP_ZIP with internal name '$ORIGINAL_NAME'"

            if ! cp "$TMP_FILE" "${TMP_DIR}/${ORIGINAL_NAME}"; then
              echo "❌ Copy failed: $FILE_URL"
              rm -rf "$TMP_DIR"
              return 1
            fi

            if ! (cd "$TMP_DIR" && zip -j -q "$TMP_ZIP" "$ORIGINAL_NAME"); then
              echo "❌ Zip creation failed: $FILE_URL"
              rm -rf "$TMP_DIR"
              return 1
            fi

            if [[ ! -s "$TMP_ZIP" ]]; then
              echo "❌ Zip creation failed – file is empty: $FILE_URL"
              rm -rf "$TMP_DIR"
              return 1
            fi

            # 3️⃣ העלאה ל‑Google Drive
            echo "🚀 Uploading ZIP to Drive: $DEST_PATH"
            if ! rclone copy "$TMP_ZIP" "$DEST_PATH" --progress; then
              echo "❌ Upload failed: $DEST_PATH"
              rm -rf "$TMP_DIR"
              return 1
            fi

            rm -rf "$TMP_DIR"
            echo "✅ Finished – ZIP uploaded successfully: $DEST_PATH"
          }

          export -f upload_one

          xargs -d '\n' -P "$PARALLEL_JOBS" -n 1 bash -c 'upload_one "$1"' _ < "$MANIFEST_FILE"
