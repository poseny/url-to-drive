name: Upload any URL → Google Drive (Free)

# מאפשר קבלת פרמטרים דרך ממשק ה‑UI של GitHub Actions
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL של הקובץ שברצונך להעלות ל‑Drive'
        required: true
        default: 'https://www.prog.co.il/attachments/%D7%A9%D7%97%D7%9E%D7%98-%D7%A2%D7%9D-%D7%97%D7%99%D7%93%D7%95%D7%AA-html.2266673/'
      dest:
        description: 'נתיב יעד ב‑Drive (לדוגמה: MyUploads/file.html)'
        required: true
        default: 'MyUploads/שחמט-עם-חידות.html'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------
      # 1️⃣ התקנת rclone
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # --------------------------------------------------------------
      # 2️⃣ יצירת קובץ קונפיג של rclone (remote בשם gdrive)
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 3️⃣ העתקת הקובץ מה‑URL ל‑Drive
      # --------------------------------------------------------------
      - name: Copy file from URL to Drive
        env:
          # קבלת ערכי הקלט שהוגדרו ב‑workflow_dispatch
          FILE_URL: ${{ github.event.inputs.url }}
          DEST_PATH: gdrive:${{ github.event.inputs.dest }}
        run: |
          set -e
          echo "🟢 Trying rclone copyurl …"
          if rclone copyurl "$FILE_URL" "$DEST_PATH" --progress; then
            echo "✅ copyurl succeeded"
          else
            echo "⚠️ copyurl failed – falling back to wget+rcat"
            wget -q -O - "$FILE_URL" | rclone rcat "$DEST_PATH" --progress
          fi
